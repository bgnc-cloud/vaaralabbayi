<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIPL Internal — Audit Feed</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 22px; margin-top: -12px; }

  .feedFilters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .feedFilters select {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px;
    font-family: inherit; background: #fff; color: var(--ink);
  }
  .feedFilters select:disabled { color: var(--g3); background: var(--off); cursor: not-allowed; }

  .feedList { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .feedRow {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .feedRow:last-child { border-bottom: none; }
  .feedRow .icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--off); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px; margin-top: 1px;
  }
  .feedRow .body { flex: 1; min-width: 0; }
  .feedRow .label { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .feedRow .sub { font-size: 12px; color: var(--g3); margin-top: 2px; }
  .feedRow .when { font-size: 11.5px; color: var(--g3); white-space: nowrap; margin-top: 2px; }
  .feedEmpty { padding: 40px; text-align: center; color: var(--g3); font-size: 13.5px; }

  .accessBox { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px; text-align: center; max-width: 480px; margin: 40px auto; }
  .accessBox .emoji { font-size: 40px; margin-bottom: 12px; }
  .accessBox h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .accessBox p { font-size: 13.5px; color: var(--g3); line-height: 1.5; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">Audit Feed</h1>
    <div class="lead">One timeline across every domain. Includes VIPL Core activity and FBC Network actions (plan changes now; more as they are added).</div>
    <div id="afContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  const AF_ALLOWED_ROLES = ['super_admin', 'admin'];
  let AF_ITEMS = [];

  const FBC_URL = 'https://uwoptohruurhbhatwkiz.supabase.co';
  const FBC_AUDIT_ENDPOINT = FBC_URL + '/functions/v1/get-audit-events';

  // HTML-escape any server value before it goes into innerHTML.
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  // Each fetcher returns feed items in a common shape: { type, icon, label, sub, ts }
  // Add a fetcher here (plus its <option> in the Type filter) when a new domain's
  // activity_logs becomes available — same aggregation pattern, just another source.
  const FEED_SOURCES = {
    ledger: {
      label: 'Ledger', icon: '📒',
      async fetch() {
        const { data } = await VIPL.sb.from('ledger_entries')
          .select('id, particulars, description, created_at')
          .order('created_at', { ascending: false }).limit(20);
        return (data || []).map(r => ({
          type: 'ledger', icon: '📒',
          label: `Ledger entry — ${r.particulars || r.description || 'Untitled'}`,
          sub: 'VIPL Core · Ledger Entry', ts: r.created_at
        }));
      }
    },
    invoices: {
      label: 'Invoices', icon: '📄',
      async fetch() {
        const { data } = await VIPL.sb.from('invoices')
          .select('id, invoice_number, buyer_name, created_at, status')
          .order('created_at', { ascending: false }).limit(20);
        return (data || []).map(r => ({
          type: 'invoices', icon: '📄',
          label: `Invoice ${r.invoice_number || ''} — ${r.buyer_name || 'Unnamed buyer'}`,
          sub: `VIPL Core · Invoices${r.status ? ' · ' + r.status : ''}`, ts: r.created_at
        }));
      }
    },
    receipts: {
      label: 'Receipts', icon: '💰',
      async fetch() {
        const { data } = await VIPL.sb.from('payment_receipts')
          .select('id, receipt_number, payer_name, purpose, created_at')
          .order('created_at', { ascending: false }).limit(20);
        return (data || []).map(r => ({
          type: 'receipts', icon: '💰',
          label: `Receipt ${r.receipt_number || ''} — ${r.payer_name || 'Unnamed payer'}`,
          sub: `VIPL Core · Payment Receipts${r.purpose ? ' · ' + r.purpose : ''}`, ts: r.created_at
        }));
      }
    },
    roles: {
      label: 'Role Changes', icon: '🧩',
      async fetch() {
        const { data } = await VIPL.sb.from('role_change_requests')
          .select('id, action, status, created_at')
          .order('created_at', { ascending: false }).limit(20);
        return (data || []).map(r => ({
          type: 'roles', icon: '🧩',
          label: `Role change — ${r.action || 'request'}`,
          sub: `VIPL Core · Role Management · ${r.status || 'pending'}`, ts: r.created_at
        }));
      }
    },
    signups: {
      label: 'Signups', icon: '👤',
      async fetch() {
        const { data } = await VIPL.sb.from('profiles')
          .select('id, full_name, role, created_at')
          .order('created_at', { ascending: false }).limit(20);
        return (data || []).map(r => ({
          type: 'signups', icon: '👤',
          label: `New account — ${r.full_name || 'Unnamed'}`,
          sub: `VIPL Core · Employees · ${r.role || 'pending'}`, ts: r.created_at
        }));
      }
    },
    fbc: {
      label: 'FBC Network', icon: '🌐',
      // Expects { events: [{ action, summary, actor_name, actor_role, occurred_at, ... }], next_cursor }.
      // Returns [] on any failure (403 for non-admins, network error, bad JSON)
      // so Promise.all in onVIPLReady still loads the other sources.
      async fetch() {
        try {
          const { data: { session } } = await VIPL.sb.auth.getSession();
          if (!session) return [];
          const res = await fetch(FBC_AUDIT_ENDPOINT, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: session.access_token, limit: 50 }),
          });
          if (!res.ok) return [];
          const result = await res.json();
          const events = Array.isArray(result && result.events) ? result.events : [];
          return events.map(e => ({
            type: 'fbc', icon: '🌐',
            label: e.summary || e.action || 'FBC event',
            sub: `FBC · ${e.action || '—'} · by ${e.actor_name || 'Unknown'} (${e.actor_role || '—'})`,
            ts: e.occurred_at
          }));
        } catch (err) {
          return [];
        }
      }
    },
  };

  function renderFeed(typeFilter) {
    const list = document.getElementById('feedList');
    const items = typeFilter === 'all' ? AF_ITEMS : AF_ITEMS.filter(i => i.type === typeFilter);
    if (!items.length) {
      list.innerHTML = `<div class="feedEmpty">Nothing here yet.</div>`;
      return;
    }
    list.innerHTML = items.slice(0, 60).map(i => `
      <div class="feedRow">
        <div class="icon">${esc(i.icon)}</div>
        <div class="body">
          <div class="label">${esc(i.label)}</div>
          <div class="sub">${esc(i.sub)}</div>
        </div>
        <div class="when">${esc(timeAgo(i.ts))}</div>
      </div>
    `).join('');
  }

  window.onVIPLReady = async function() {
    const role = VIPL.profile.role;
    const el = document.getElementById('afContent');

    if (!AF_ALLOWED_ROLES.includes(role)) {
      el.innerHTML = `
        <div class="accessBox">
          <div class="emoji">🔒</div>
          <h2>Restricted to Super Admin and Admin</h2>
          <p>The Audit Feed aggregates activity across every domain. Only Super Admin and Admin can view it right now.</p>
        </div>
      `;
      return;
    }

    el.innerHTML = `
      <div class="feedFilters">
        <select id="domainFilter" disabled>
          <option>VIPL Core</option>
        </select>
        <select id="typeFilter">
          <option value="all">All Activity</option>
          ${Object.entries(FEED_SOURCES).map(([k, s]) => `<option value="${esc(k)}">${esc(s.label)}</option>`).join('')}
        </select>
      </div>
      <div class="feedList" id="feedList">Loading…</div>
    `;

    const results = await Promise.all(Object.values(FEED_SOURCES).map(s => s.fetch()));
    AF_ITEMS = results.flat().sort((a, b) => new Date(b.ts) - new Date(a.ts));
    renderFeed('all');

    document.getElementById('typeFilter').onchange = (e) => renderFeed(e.target.value);
  };
</script>
</body>
</html>
