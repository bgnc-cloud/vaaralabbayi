<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIPL Internal — Command Center</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 28px; margin-top: -12px; }

  .domainGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 16px; margin-bottom: 28px; }
  .domainCard {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .domainCard .top { display: flex; align-items: center; justify-content: space-between; }
  .domainCard .name { font-weight: 800; font-size: 15px; }
  .statusPill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
  }
  .statusPill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .statusPill.live      { background: #E3F5F3; color: #0E9488; }
  .statusPill.live .dot { background: #0E9488; }
  .statusPill.awaiting      { background: #FBF1DE; color: #B7791F; }
  .statusPill.awaiting .dot { background: #B7791F; }
  .statusPill.planned      { background: #F1F3F6; color: var(--g3); }
  .statusPill.planned .dot { background: #9aa5b1; }

  .domainCard .note { font-size: 12.5px; color: var(--g3); line-height: 1.5; }
  .domainStats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .domainStat { background: var(--off); border-radius: 10px; padding: 10px 12px; }
  .domainStat .v { font-family:'Plus Jakarta Sans',sans-serif; font-size: 19px; font-weight: 800; }
  .domainStat .l { font-size: 11px; color: var(--g3); margin-top: 2px; }
  .domainStat.warn .v { color: #B7791F; }
  .domainCard .lastActivity { font-size: 11.5px; color: var(--g3); margin-top: 2px; }

  .sectionLbl { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--g3); margin: 4px 0 12px; }

  .accessBox { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px; text-align: center; max-width: 480px; margin: 40px auto; }
  .accessBox .emoji { font-size: 40px; margin-bottom: 12px; }
  .accessBox h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .accessBox p { font-size: 13.5px; color: var(--g3); line-height: 1.5; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">Command Center</h1>
    <div class="lead">Single view of every domain behind VIPL Internal — status, activity, and what still needs attention.</div>
    <div id="ccContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  // Only super_admin can see this for now — broaden this array later the same way
  // auditor_team was added per-page in earlier sessions, if other roles should get visibility.
  const CC_ALLOWED_ROLES = ['super_admin'];

  function timeAgo(iso) {
    if (!iso) return '—';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  // ── Domain scaffold ──────────────────────────────────────────
  // Each domain is either:
  //   kind: 'live'     → has its own Supabase project wired in, `load()` fetches real stats
  //   kind: 'awaiting'  → domain decided/named, infra not created yet
  //   kind: 'planned'   → not started
  // When FBC (or Warehouse, Subscriber/EMI) gets its own Supabase project + bridge,
  // flip its entry to kind:'live' and give it a load() function — same shape as VIPL Core's below.
  const DOMAINS = [
    {
      key: 'vipl-core', name: 'VIPL Core', kind: 'live',
      note: 'Ledger, GST/Audit, Invoices, Receipts, Investor & Loan Portals, Employees/Roles.',
      async load() {
        const [pendingProfiles, pendingRoleReqs, gstAttention, lastLedger, lastInvoice, lastReceipt] = await Promise.all([
          VIPL.sb.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'pending'),
          VIPL.sb.from('role_change_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
          VIPL.sb.from('ledger_entries').select('id', { count: 'exact', head: true }).is('gst_rate', null).eq('gst_not_applicable', false),
          VIPL.sb.from('ledger_entries').select('created_at').order('created_at', { ascending: false }).limit(1),
          VIPL.sb.from('invoices').select('created_at').order('created_at', { ascending: false }).limit(1),
          VIPL.sb.from('payment_receipts').select('created_at').order('created_at', { ascending: false }).limit(1),
        ]);
        const timestamps = [lastLedger, lastInvoice, lastReceipt]
          .map(r => r.data && r.data[0] ? new Date(r.data[0].created_at).getTime() : 0)
          .filter(Boolean);
        const lastActivity = timestamps.length ? new Date(Math.max(...timestamps)).toISOString() : null;
        return {
          pendingApprovals: (pendingProfiles.count || 0) + (pendingRoleReqs.count || 0),
          needsAttention: gstAttention.count || 0,
          lastActivity,
        };
      }
    },
    {
      key: 'fbc-network', name: 'FBC Network', kind: 'awaiting',
      note: 'Repo, Vercel project, and fbc.vaaralabbayi.com domain are live. Supabase project pending — organization is on the free-tier project limit, upgrade scheduled.',
    },
    {
      key: 'warehouse', name: 'Warehouse & Supply Chain', kind: 'planned',
      note: 'Not started — sequenced after FBC Network, since FBC\'s Dark Stores depend on it.',
    },
    {
      key: 'subscriber-emi', name: 'Subscriber & EMI Platform', kind: 'planned',
      note: 'Not started — highest exposure domain (unlimited users, PII, payments). Deserves its own dedicated design session.',
    },
    {
      key: 'fico', name: 'FICO Investor Portal', kind: 'planned',
      note: 'Recommended to live inside VIPL Core rather than as its own domain. Needs a bridge view into FBC geography once that exists.',
    },
  ];

  function statusMeta(kind) {
    if (kind === 'live') return { cls: 'live', label: 'Operational' };
    if (kind === 'awaiting') return { cls: 'awaiting', label: 'Awaiting Setup' };
    return { cls: 'planned', label: 'Planned' };
  }

  function renderDomainCard(domain, stats) {
    const status = statusMeta(domain.kind);
    let statsHtml = '';
    if (domain.kind === 'live' && stats) {
      statsHtml = `
        <div class="domainStats">
          <div class="domainStat ${stats.pendingApprovals ? 'warn' : ''}"><div class="v">${stats.pendingApprovals}</div><div class="l">Pending Approvals</div></div>
          <div class="domainStat ${stats.needsAttention ? 'warn' : ''}"><div class="v">${stats.needsAttention}</div><div class="l">GST Needs Attention</div></div>
        </div>
        <div class="lastActivity">Last activity: ${timeAgo(stats.lastActivity)}</div>
      `;
    }
    return `
      <div class="domainCard">
        <div class="top">
          <div class="name">${domain.name}</div>
          <span class="statusPill ${status.cls}"><span class="dot"></span>${status.label}</span>
        </div>
        <div class="note">${domain.note}</div>
        ${statsHtml}
      </div>
    `;
  }

  window.onVIPLReady = async function() {
    const role = VIPL.profile.role;
    const el = document.getElementById('ccContent');

    if (!CC_ALLOWED_ROLES.includes(role)) {
      el.innerHTML = `
        <div class="accessBox">
          <div class="emoji">🔒</div>
          <h2>Restricted to Super Admin</h2>
          <p>The Command Center gives infrastructure-level visibility across every domain. Only Super Admin can view it right now.</p>
        </div>
      `;
      return;
    }

    el.innerHTML = `<div class="sectionLbl">Domains</div><div class="domainGrid" id="domainGrid">Loading…</div>`;
    const grid = document.getElementById('domainGrid');

    const results = await Promise.all(DOMAINS.map(d => d.kind === 'live' ? d.load() : Promise.resolve(null)));
    grid.innerHTML = DOMAINS.map((d, i) => renderDomainCard(d, results[i])).join('');
  };
</script>
</body>
</html>
