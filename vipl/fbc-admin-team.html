<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIPL Internal — FBC Admin Team</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 8px; margin-top: -12px; }
  .draftNote {
    font-size: 12.5px; color: #0E9488; background: #E3F5F3; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 24px; display: inline-block;
  }
  .statsGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-bottom: 24px; }
  .statBox { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .statBox .v { font-family:'Plus Jakarta Sans',sans-serif; font-size: 24px; font-weight: 800; }
  .statBox .l { font-size: 11.5px; color: var(--g3); margin-top: 2px; }
  .statBox.vacant .v { color: #B7791F; }
  .statBox.active .v { color: #0E9488; }

  .deptGrid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 700px) { .deptGrid { grid-template-columns: 1fr 1fr; } }
  .deptCard { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .deptCardHead { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; cursor: pointer; }
  .deptCardHead:hover { background: var(--off); }
  .deptName { font-weight: 800; font-size: 14.5px; }
  .deptChevron { font-size: 20px; color: var(--g3); transition: transform .15s; }
  .deptCard.open .deptChevron { transform: rotate(90deg); color: var(--blue); }
  .deptStatsRow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 18px 16px; }
  .deptStat { background: var(--off); border-radius: 10px; padding: 8px; text-align: center; }
  .deptStat .v { display: block; font-size: 16px; font-weight: 800; }
  .deptStat .l { display: block; font-size: 10px; color: var(--g3); }
  .deptStat.vacant .v { color: #B7791F; }
  .deptStat.filled .v { color: #0E9488; }
  .deptDetail { display: none; border-top: 1px solid var(--off); padding: 10px 18px 16px; }

  .posRow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--off); gap: 10px; }
  .posRow:last-child { border-bottom: none; }
  .posMain { min-width: 0; flex: 1; }
  .posCode { font-weight: 700; font-size: 13px; }
  .posLevel { font-size: 10px; font-weight: 800; background: var(--off); color: var(--ink); padding: 2px 7px; border-radius: 6px; margin-left: 4px; }
  .posGeo { font-size: 12px; color: var(--g3); margin-top: 2px; }
  .posOccupant { font-size: 12px; color: var(--navy, var(--ink)); font-weight: 700; margin-top: 2px; }
  .posPill { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .posPill.vacant { background: #FBF1DE; color: #B7791F; }
  .posPill.filled { background: #E3F5F3; color: #0E9488; }
  .posActions { display: flex; gap: 6px; margin-top: 4px; }
  .actionBtn { font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--ink); }
  .actionBtn:hover { border-color: var(--blue); color: var(--blue); }
  .actionBtn.danger:hover { border-color: #C0392B; color: #C0392B; }

  .modalBackdrop { display: none; position: fixed; inset: 0; background: rgba(11,29,46,.42); z-index: 50; align-items: center; justify-content: center; }
  .modalBackdrop.open { display: flex; }
  .modalBox { background: #fff; border-radius: 14px; padding: 26px; width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
  .modalBox h3 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 16px; font-weight: 800; margin-bottom: 16px; }
  .modalBox label { font-size: 12px; font-weight: 700; color: var(--g3); display: block; margin-bottom: 4px; margin-top: 10px; }
  .modalBox input, .modalBox select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; font-family: inherit; box-sizing: border-box; }
  .modalBtns { display: flex; gap: 8px; margin-top: 18px; }
  .modalBtns button { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; }
  .modalBtns .confirmBtn { background: var(--blue); color: #fff; }
  .modalBtns .cancelBtn { background: var(--off); color: var(--ink); }
  .modalMsg { font-size: 12.5px; margin-top: 10px; }

  .accessBox { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px; text-align: center; max-width: 480px; margin: 40px auto; }
  .accessBox .emoji { font-size: 40px; margin-bottom: 12px; }
  .accessBox h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .accessBox p { font-size: 13.5px; color: var(--g3); line-height: 1.5; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">FBC Admin Team</h1>
    <div class="lead">The Accounts/Collections/Legal/Followups/Communications/Monitoring support team — parallel to the operational CEO→BD→ZM→RM→BDM chain, one State + District position per department.</div>
    <div id="adminContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  const ADMIN_TEAM_ROLES = ['super_admin', 'admin', 'hr_manager'];

  const FBC_URL = 'https://uwoptohruurhbhatwkiz.supabase.co';
  const FBC_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3b3B0b2hydXVyaGJoYXR3a2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzA0OTgsImV4cCI6MjEwMTAwNjQ5OH0.5pPk1JNy1xm2NCD9Xv6rZpDrf-jprFwaXtRk4WshL18';
  const fbcSb = supabase.createClient(FBC_URL, FBC_ANON_KEY);
  const TEAM_ENDPOINT = FBC_URL + '/functions/v1/manage-fbc-admin-team';
  const LOGIN_ENDPOINT = FBC_URL + '/functions/v1/setup-fbc-login';

  let ALL_POSITIONS = [];
  let ROSTER_BY_POSITION = {};
  let DEPARTMENTS = [];

  async function getToken() {
    const { data: { session } } = await VIPL.sb.auth.getSession();
    return session ? session.access_token : null;
  }

  function posRowHtml(p) {
    const o = ROSTER_BY_POSITION[p.id];
    const geo = p.level === 'state' ? p.state_name : p.district_name;
    return `
      <div class="posRow">
        <div class="posMain">
          <div class="posCode">${p.position_code} <span class="posLevel">${p.level}</span></div>
          <div class="posGeo">${geo}</div>
          ${o ? `<div class="posOccupant">${o.full_name} (${o.employee_code})</div>` : ''}
          ${o ? `
            <div class="posActions">
              <span class="actionBtn danger" onclick="terminateAdmin('${o.appointment_id}')">Terminate</span>
              <span class="actionBtn" onclick="setupAdminLogin('${o.employee_id}')">${o.has_login ? 'Reset PIN' : 'Set Up Login'}</span>
            </div>` : `<div class="posActions"><span class="actionBtn" onclick="openHireModal('${p.id}', '${p.position_code}')">Hire</span></div>`}
        </div>
        <span class="posPill ${p.status === 'active' ? 'filled' : 'vacant'}">${p.status === 'active' ? 'Filled' : 'Vacant'}</span>
      </div>
    `;
  }

  function renderDeptCard(dept) {
    const positions = ALL_POSITIONS.filter(p => p.department_code === dept.code);
    const total = positions.length;
    const filled = positions.filter(p => p.status === 'active').length;
    const vacant = total - filled;
    const safeId = 'deptDetail-' + dept.code;
    return `
      <div class="deptCard">
        <div class="deptCardHead" onclick="toggleDept('${dept.code}')">
          <div class="deptName">${dept.name}</div>
          <div class="deptChevron">›</div>
        </div>
        <div class="deptStatsRow">
          <div class="deptStat"><span class="v">${total}</span><span class="l">Total</span></div>
          <div class="deptStat vacant"><span class="v">${vacant}</span><span class="l">Vacant</span></div>
          <div class="deptStat filled"><span class="v">${filled}</span><span class="l">Filled</span></div>
        </div>
        <div class="deptDetail" id="${safeId}">
          ${positions.sort((a,b) => a.position_code.localeCompare(b.position_code)).map(posRowHtml).join('')}
        </div>
      </div>
    `;
  }

  window.toggleDept = function(code) {
    const panel = document.getElementById('deptDetail-' + code);
    const isOpen = panel.style.display === 'block';
    document.querySelectorAll('.deptDetail').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.deptCard').forEach(el => el.classList.remove('open'));
    if (!isOpen) { panel.style.display = 'block'; panel.closest('.deptCard').classList.add('open'); }
  };

  window.openHireModal = function(positionId, positionCode) {
    document.getElementById('modalArea').innerHTML = `
      <div class="modalBackdrop open">
        <div class="modalBox">
          <h3>Hire into ${positionCode}</h3>
          <label>Full name *</label>
          <input type="text" id="hireName" placeholder="Full name">
          <label>Phone</label>
          <input type="tel" id="hirePhone" placeholder="Phone number">
          <label>Email</label>
          <input type="email" id="hireEmail" placeholder="Email address">
          <div class="modalBtns">
            <button class="confirmBtn" onclick="submitHire('${positionId}')">Hire</button>
            <button class="cancelBtn" onclick="closeModal()">Cancel</button>
          </div>
          <div class="modalMsg" id="modalMsg"></div>
        </div>
      </div>
    `;
  };

  window.closeModal = function() { document.getElementById('modalArea').innerHTML = ''; };

  window.submitHire = async function(positionId) {
    const msg = document.getElementById('modalMsg');
    const full_name = document.getElementById('hireName').value.trim();
    const phone = document.getElementById('hirePhone').value.trim();
    const email = document.getElementById('hireEmail').value.trim();
    if (!full_name) { msg.style.color = '#C0392B'; msg.textContent = 'Full name is required.'; return; }
    msg.style.color = 'var(--g3)'; msg.textContent = 'Hiring…';
    const token = await getToken();
    try {
      const res = await fetch(TEAM_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token, action: 'hire', admin_position_id: positionId, full_name, phone: phone || null, email: email || null }),
      });
      const result = await res.json();
      if (!res.ok) { msg.style.color = '#C0392B'; msg.textContent = result.error || 'Failed.'; return; }
      await loadEverything();
      closeModal();
      renderAll();
    } catch (e) { msg.style.color = '#C0392B'; msg.textContent = 'Network error.'; }
  };

  window.terminateAdmin = async function(appointmentId) {
    if (!confirm('Terminate this appointment?')) return;
    const token = await getToken();
    try {
      const res = await fetch(TEAM_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token, action: 'terminate', appointment_id: appointmentId }),
      });
      if (res.ok) { await loadEverything(); renderAll(); }
    } catch (e) {}
  };

  window.setupAdminLogin = async function(employeeId) {
    if (!confirm('Set up / reset login for this employee?')) return;
    const token = await getToken();
    try {
      const res = await fetch(LOGIN_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token, employee_id: employeeId }),
      });
      const result = await res.json();
      if (!res.ok) { alert('Failed: ' + (result.error || 'unknown')); return; }
      alert(`Login ${result.action === 'created' ? 'created' : 'reset'} for ${result.email}.\n\nPIN: ${result.pin}\n\nShare securely — it won't be shown again.`);
      await loadEverything();
      renderAll();
    } catch (e) { alert('Network error.'); }
  };

  async function loadEverything() {
    const [{ data: positions }, { data: departments }] = await Promise.all([
      fbcSb.from('fbc_admin_positions').select('id, position_code, level, status, department_id, fbc_departments(code, name), states(name), districts(name, region)'),
      fbcSb.from('fbc_departments').select('id, code, name, active').eq('active', true).order('name'),
    ]);
    DEPARTMENTS = departments || [];
    ALL_POSITIONS = (positions || []).map(p => ({
      id: p.id, position_code: p.position_code, level: p.level, status: p.status,
      department_code: p.fbc_departments ? p.fbc_departments.code : '',
      state_name: p.states ? p.states.name : '', district_name: p.districts ? p.districts.name : '',
    }));

    const token = await getToken();
    try {
      const res = await fetch(TEAM_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token, action: 'get_roster' }),
      });
      const result = await res.json();
      ROSTER_BY_POSITION = {};
      (result.roster || []).forEach(r => { ROSTER_BY_POSITION[r.admin_position_id] = r; });
    } catch (e) {}
  }

  // Builds the "Statewide — N departments × (1 state + 28 district) = M positions"
  // note from the actual loaded data, so it never goes stale again when a
  // department is added or removed — no hardcoded numbers.
  function buildScopeNote() {
    const deptCount = DEPARTMENTS.length;
    const total = ALL_POSITIONS.length;
    return `✅ Statewide — ${deptCount} department${deptCount === 1 ? '' : 's'} × (1 state + 28 district) = ${total} positions.`;
  }

  function renderAll() {
    document.getElementById('scopeNoteArea').innerHTML = `<div class="draftNote">${buildScopeNote()}</div>`;

    const total = ALL_POSITIONS.length;
    const filled = ALL_POSITIONS.filter(p => p.status === 'active').length;
    const vacant = total - filled;
    document.getElementById('statsArea').innerHTML = `
      <div class="statsGrid">
        <div class="statBox"><div class="v">${total}</div><div class="l">Total Positions</div></div>
        <div class="statBox vacant"><div class="v">${vacant}</div><div class="l">Vacant</div></div>
        <div class="statBox active"><div class="v">${filled}</div><div class="l">Filled</div></div>
      </div>
    `;
    document.getElementById('deptGrid').innerHTML = DEPARTMENTS.map(renderDeptCard).join('');
  }

  window.onVIPLReady = async function() {
    const role = VIPL.profile.role;
    const el = document.getElementById('adminContent');
    if (!ADMIN_TEAM_ROLES.includes(role)) {
      el.innerHTML = `<div class="accessBox"><div class="emoji">🔒</div><h2>Restricted</h2><p>Visible to Super Admin, Admin, and HR Manager.</p></div>`;
      return;
    }
    el.innerHTML = `
      <div id="scopeNoteArea"></div>
      <div id="statsArea">Loading…</div>
      <div class="deptGrid" id="deptGrid"></div>
      <div id="modalArea"></div>
    `;
    await loadEverything();
    renderAll();
  };
</script>
</body>
</html>
