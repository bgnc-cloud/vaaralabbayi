<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIPL Internal — FBC Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 8px; margin-top: -12px; }
  .scopeNote {
    font-size: 12.5px; color: #0E9488; background: #E3F5F3; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 10px; display: inline-block;
  }
  .draftNote {
    font-size: 12.5px; color: #B7791F; background: #FBF1DE; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 16px; display: block;
  }
  .viewOnlyNote {
    font-size: 12.5px; color: var(--g3); background: var(--off); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 16px; display: inline-block;
  }

  .statsGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-bottom: 20px; }
  .statBox { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .statBox .v { font-family:'Plus Jakarta Sans',sans-serif; font-size: 24px; font-weight: 800; }
  .statBox .l { font-size: 11.5px; color: var(--g3); margin-top: 2px; }
  .statBox.vacant .v { color: #B7791F; }
  .statBox.active .v { color: #0E9488; }

  .filterBar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .filterBar select {
    padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff; color: var(--ink);
  }
  .roleBreakdown { display: flex; gap: 10px; flex-wrap: wrap; }
  .roleChip {
    background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 7px 16px;
    font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px;
    cursor: pointer; transition: all .12s; user-select: none;
  }
  .roleChip:hover { border-color: var(--blue); }
  .roleChip .n { color: var(--blue); }
  .roleChip.selected { background: var(--blue); border-color: var(--blue); color: #fff; }
  .roleChip.selected .n { color: #fff; }
  .filterHint { font-size: 12px; color: var(--g3); margin-bottom: 24px; }

  .districtGroup { margin-bottom: 24px; }
  .districtGroup h3 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 15px; font-weight: 800; margin-bottom: 2px; }
  .districtGroup .regionTag { font-size: 11px; color: var(--g3); font-weight: 600; margin-bottom: 10px; display: block; }
  .statusTable { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .statusRow {
    display: grid; grid-template-columns: 1.4fr 0.55fr 1.3fr 0.7fr 1.6fr 1.3fr;
    align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .statusRow.noActions { grid-template-columns: 1.5fr 0.6fr 1.5fr 0.8fr 1.8fr; }
  .statusRow:last-child { border-bottom: none; }
  .statusRow.headerRow { background: var(--off); font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--g3); letter-spacing: .03em; align-items: center; }
  .statusRow .code { font-weight: 700; color: var(--ink); }
  .statusRow .roleTag {
    font-size: 10.5px; font-weight: 800; background: var(--off); color: var(--ink);
    padding: 2px 8px; border-radius: 6px; width: fit-content;
  }
  .statusPill2 { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; width: fit-content; }
  .statusPill2.vacant { background: #FBF1DE; color: #B7791F; }
  .statusPill2.active { background: #E3F5F3; color: #0E9488; }
  .occupant { color: var(--g3); line-height: 1.5; }
  .occupant .empName { color: var(--ink); font-weight: 700; }
  .occupant .empCode { color: var(--blue); font-weight: 600; }
  .occupant .empMeta { font-size: 12px; color: var(--g3); }
  .occupant .none { color: var(--g3); }
  .rowActions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actionBtn {
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--ink);
  }
  .actionBtn:hover { border-color: var(--blue); color: var(--blue); }
  .actionBtn.danger:hover { border-color: #C0392B; color: #C0392B; }

  .inlinePanel {
    grid-column: 1 / -1; background: var(--off); border-radius: 10px; padding: 16px; margin-top: 8px;
  }
  .inlinePanel .panelTitle { font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
  .inlinePanel select, .inlinePanel input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; font-family: inherit; background: #fff; margin-bottom: 8px; box-sizing: border-box;
  }
  .inlinePanel label { font-size: 11px; font-weight: 700; color: var(--g3); display: block; margin-bottom: 3px; }
  .panelMatch { background: #fff; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; margin-bottom: 8px; font-size: 12.5px; }
  .panelMatch .code { font-weight: 700; color: var(--blue); }
  .panelBtns { display: flex; gap: 8px; margin-top: 4px; }
  .panelBtns button {
    padding: 8px 14px; border-radius: 7px; border: none; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .panelBtns .confirmBtn { background: var(--blue); color: #fff; }
  .panelBtns .confirmBtn.danger { background: #C0392B; }
  .panelBtns .cancelBtn { background: #fff; border: 1px solid var(--border) !important; color: var(--ink); }
  .panelMsg { font-size: 12px; margin-top: 8px; }

  .accessBox { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px; text-align: center; max-width: 480px; margin: 40px auto; }
  .accessBox .emoji { font-size: 40px; margin-bottom: 12px; }
  .accessBox h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .accessBox p { font-size: 13.5px; color: var(--g3); line-height: 1.5; }

  @media (max-width: 800px) {
    .statusRow { grid-template-columns: 1fr; gap: 4px; }
    .statusRow.headerRow { display: none; }
  }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">FBC Dashboard</h1>
    <div class="lead">Every FBC Network position, who (if anyone) currently holds it, grouped by district.</div>
    <div id="fbcDashContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  const FBC_DASH_VIEW_ROLES = ['super_admin', 'admin', 'hr_manager', 'investor', 'director_1', 'director_2'];
  const FBC_DASH_EDIT_ROLES = ['super_admin', 'admin', 'hr_manager'];

  const FBC_URL = 'https://uwoptohruurhbhatwkiz.supabase.co';
  const FBC_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3b3B0b2hydXVyaGJoYXR3a2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzA0OTgsImV4cCI6MjEwMTAwNjQ5OH0.5pPk1JNy1xm2NCD9Xv6rZpDrf-jprFwaXtRk4WshL18';
  const fbcSb = supabase.createClient(FBC_URL, FBC_ANON_KEY);
  const ROSTER_ENDPOINT = FBC_URL + '/functions/v1/get-fbc-roster';
  const TERMINATE_ENDPOINT = FBC_URL + '/functions/v1/terminate-fbc-appointment';
  const TRANSFER_ENDPOINT = FBC_URL + '/functions/v1/transfer-fbc-employee';

  // ---------------------------------------------------------------------
  // Supabase's PostgREST layer caps any single request at 1000 rows by
  // default. With 7,000+ FO positions now in play, a plain .select() call
  // silently truncates. This helper re-issues the query with .range()
  // until a page comes back shorter than PAGE_SIZE, so callers always get
  // every row regardless of table size.
  // ---------------------------------------------------------------------
  const FETCH_PAGE_SIZE = 1000;
  async function fetchAllRows(buildQuery) {
    let allRows = [];
    let from = 0;
    while (true) {
      const { data, error } = await buildQuery().range(from, from + FETCH_PAGE_SIZE - 1);
      if (error) throw error;
      allRows = allRows.concat(data || []);
      if (!data || data.length < FETCH_PAGE_SIZE) break;
      from += FETCH_PAGE_SIZE;
    }
    return allRows;
  }

  const ROLE_GEO_STEPS = {
    CEO: [], BD: [], ZM: ['district'], RM: ['district','division'], BDM: ['district','division','mandal'],
    MM: ['district','division','mandal','village'], FO: ['district','division','mandal','village'],
  };
  const STEP_LABELS = { district: 'District', division: 'Revenue Division', mandal: 'Mandal', village: 'Village' };
  const ROLE_ORDER = ['CEO','BD','ZM','RM','BDM','MM','FO'];
  const REGION_ORDER = ['Uttarandhra', 'Coastal Andhra', 'Rayalaseema'];

  let CAN_EDIT = false;
  let ALL_POSITIONS = [];
  let ALL_VACANT = [];
  let ROSTER_BY_POSITION = {};
  let SELECTED_ROLE = 'all';
  let SELECTED_REGION = 'all';
  let SELECTED_DISTRICT = 'all';
  let OPEN_PANEL = null;
  let TRANSFER_SELECTION = {};
  let TRANSFER_MATCH = null;

  function geoLabel(p) {
    if (p.village_name) return p.village_name + ' village';
    if (p.mandal_name) return p.mandal_name + ' mandal';
    if (p.revenue_division_name) return p.revenue_division_name + ' division';
    if (p.district_name) return p.district_name + ' district';
    if (p.state_name) return p.state_name;
    return '—';
  }
  function districtLabel(p) { return p.district_name || p.state_name || 'Other'; }

  function occupantHtml(p) {
    const o = ROSTER_BY_POSITION[p.id];
    if (!o) return `<span class="occupant none">—</span>`;
    const metaParts = [];
    if (o.phone) metaParts.push(o.phone);
    if (o.email) metaParts.push(o.email);
    return `
      <div class="occupant">
        <div><span class="empName">${o.full_name}</span> <span class="empCode">(${o.employee_code})</span></div>
        ${metaParts.length ? `<div class="empMeta">${metaParts.join(' · ')}</div>` : ''}
      </div>
    `;
  }

  function actionsHtml(p) {
    if (!CAN_EDIT) return '';
    const o = ROSTER_BY_POSITION[p.id];
    if (!o) return '';
    return `
      <div class="rowActions">
        <span class="actionBtn" onclick="openPanel('${p.id}','transfer')">Transfer</span>
        <span class="actionBtn danger" onclick="openPanel('${p.id}','terminate')">Terminate</span>
        <span class="actionBtn" onclick="setupLogin('${p.id}')">${o.has_login ? 'Reset PIN' : 'Set Up Login'}</span>
      </div>
    `;
  }

  const SETUP_LOGIN_ENDPOINT = 'https://uwoptohruurhbhatwkiz.supabase.co/functions/v1/setup-fbc-login';

  window.setupLogin = async function(positionId) {
    const o = ROSTER_BY_POSITION[positionId];
    if (!o) return;
    const label = o.has_login ? 'Reset PIN for' : 'Set up login for';
    if (!confirm(`${label} ${o.full_name} (${o.employee_code})?`)) return;

    const { data: { session } } = await VIPL.sb.auth.getSession();
    try {
      const res = await fetch(SETUP_LOGIN_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: session.access_token, employee_id: o.employee_id }),
      });
      const result = await res.json();
      if (!res.ok) { alert('Failed: ' + (result.error || 'unknown error')); return; }
      alert(`Login ${result.action === 'created' ? 'created' : 'reset'} for ${result.email}.\n\nPIN: ${result.pin}\n\nShare this PIN securely with ${o.full_name} — it won't be shown again.`);
      await loadEverything();
      renderTables();
    } catch (e) { alert('Network error.'); }
  };

  function terminatePanelHtml(p) {
    return `
      <div class="inlinePanel">
        <div class="panelTitle">Terminate appointment — ${p.position_code}</div>
        <label>End date</label>
        <input type="date" id="termEndDate" value="${new Date().toISOString().slice(0,10)}">
        <label>Notes (optional)</label>
        <input type="text" id="termNotes" placeholder="Reason, if any">
        <div class="panelBtns">
          <button class="confirmBtn danger" onclick="submitTerminate('${p.id}')">Confirm Termination</button>
          <button class="cancelBtn" onclick="closePanel()">Cancel</button>
        </div>
        <div class="panelMsg" id="panelMsg"></div>
      </div>
    `;
  }

  function transferPanelHtml(p) {
    TRANSFER_SELECTION = { role: '', district: '', division: '', mandal: '', village: '' };
    TRANSFER_MATCH = null;
    return `
      <div class="inlinePanel" id="transferPanel">
        <div class="panelTitle">Transfer ${ROSTER_BY_POSITION[p.id].full_name} out of ${p.position_code}</div>
        <label>New role</label>
        <select id="tRole" onchange="tRoleChanged()">
          <option value="">Select role…</option>
          ${ROLE_ORDER.filter(r => ALL_VACANT.some(v => v.role_code === r)).map(r => `<option value="${r}">${r}</option>`).join('')}
        </select>
        <div id="tGeoSteps"></div>
        <div id="tMatchArea"></div>
        <div class="panelBtns">
          <button class="confirmBtn" id="tConfirmBtn" onclick="submitTransfer('${p.id}')" disabled>Confirm Transfer</button>
          <button class="cancelBtn" onclick="closePanel()">Cancel</button>
        </div>
        <div class="panelMsg" id="panelMsg"></div>
      </div>
    `;
  }

  function tRoleChanged() {
    TRANSFER_SELECTION = { role: document.getElementById('tRole').value, district: '', division: '', mandal: '', village: '' };
    TRANSFER_MATCH = null;
    renderTransferGeoSteps();
    renderTransferMatch();
  }

  // Geography step -> ALL_VACANT field name. Used both to build dropdown
  // options and to filter candidates as each step is picked.
  function geoFieldForStep(step) {
    if (step === 'district') return 'district_name';
    if (step === 'division') return 'revenue_division_name';
    if (step === 'mandal') return 'mandal_name';
    if (step === 'village') return 'village_name';
    return null;
  }

  function matchesRunningFilter(v, runningFilter) {
    if (runningFilter.role && v.role_code !== runningFilter.role) return false;
    if (runningFilter.district && v.district_name !== runningFilter.district) return false;
    if (runningFilter.division && v.revenue_division_name !== runningFilter.division) return false;
    if (runningFilter.mandal && v.mandal_name !== runningFilter.mandal) return false;
    if (runningFilter.village && v.village_name !== runningFilter.village) return false;
    return true;
  }

  function renderTransferGeoSteps() {
    const container = document.getElementById('tGeoSteps');
    const steps = ROLE_GEO_STEPS[TRANSFER_SELECTION.role] || [];
    let html = '';
    let runningFilter = { role: TRANSFER_SELECTION.role };
    for (const step of steps) {
      const candidates = ALL_VACANT.filter(v => matchesRunningFilter(v, runningFilter));
      const key = geoFieldForStep(step);
      const options = [...new Set(candidates.map(c => c[key]).filter(Boolean))].sort();
      html += `
        <label>${STEP_LABELS[step]}</label>
        <select data-tstep="${step}" onchange="tStepChanged(this)">
          <option value="">Select ${STEP_LABELS[step].toLowerCase()}…</option>
          ${options.map(o => `<option value="${o}">${o}</option>`).join('')}
        </select>
      `;
      runningFilter[step] = TRANSFER_SELECTION[step];
      if (!TRANSFER_SELECTION[step]) break;
    }
    container.innerHTML = html;
  }

  function tStepChanged(sel) {
    const step = sel.dataset.tstep;
    TRANSFER_SELECTION[step] = sel.value;
    const order = ['district','division','mandal','village'];
    order.slice(order.indexOf(step) + 1).forEach(k => TRANSFER_SELECTION[k] = '');
    TRANSFER_MATCH = null;
    renderTransferGeoSteps();
    renderTransferMatch();
  }

  function renderTransferMatch() {
    const box = document.getElementById('tMatchArea');
    const btn = document.getElementById('tConfirmBtn');
    if (!TRANSFER_SELECTION.role) { box.innerHTML = ''; btn.disabled = true; return; }
    const steps = ROLE_GEO_STEPS[TRANSFER_SELECTION.role] || [];
    if (!steps.every(s => TRANSFER_SELECTION[s])) { box.innerHTML = ''; btn.disabled = true; return; }

    const matches = ALL_VACANT.filter(v => {
      if (v.role_code !== TRANSFER_SELECTION.role) return false;
      if (TRANSFER_SELECTION.district && v.district_name !== TRANSFER_SELECTION.district) return false;
      if (TRANSFER_SELECTION.division && v.revenue_division_name !== TRANSFER_SELECTION.division) return false;
      if (TRANSFER_SELECTION.mandal && v.mandal_name !== TRANSFER_SELECTION.mandal) return false;
      if (TRANSFER_SELECTION.village && v.village_name !== TRANSFER_SELECTION.village) return false;
      return true;
    });
    if (!matches.length) {
      box.innerHTML = `<div class="panelMatch">No vacant seat here.</div>`;
      btn.disabled = true;
      return;
    }
    TRANSFER_MATCH = matches[0];
    box.innerHTML = `<div class="panelMatch">Moving to <span class="code">${TRANSFER_MATCH.position_code}</span> — ${geoLabel(TRANSFER_MATCH)}</div>`;
    btn.disabled = false;
  }

  window.openPanel = function(positionId, type) {
    if (!CAN_EDIT) return;
    OPEN_PANEL = { positionId, type };
    renderTables();
  };
  window.closePanel = function() {
    OPEN_PANEL = null;
    renderTables();
  };

  window.submitTerminate = async function(positionId) {
    const o = ROSTER_BY_POSITION[positionId];
    const msg = document.getElementById('panelMsg');
    msg.style.color = 'var(--g3)'; msg.textContent = 'Terminating…';
    const { data: { session } } = await VIPL.sb.auth.getSession();
    try {
      const res = await fetch(TERMINATE_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          access_token: session.access_token,
          appointment_id: o.appointment_id,
          end_date: document.getElementById('termEndDate').value,
          notes: document.getElementById('termNotes').value || null,
        }),
      });
      const result = await res.json();
      if (!res.ok) { msg.style.color = '#C0392B'; msg.textContent = result.error || 'Termination failed.'; return; }
      msg.style.color = 'var(--green)'; msg.textContent = 'Terminated.';
      await loadEverything();
      closePanel();
    } catch (e) { msg.style.color = '#C0392B'; msg.textContent = 'Network error.'; }
  };

  window.submitTransfer = async function(positionId) {
    const o = ROSTER_BY_POSITION[positionId];
    const msg = document.getElementById('panelMsg');
    if (!TRANSFER_MATCH) return;
    msg.style.color = 'var(--g3)'; msg.textContent = 'Transferring…';
    const { data: { session } } = await VIPL.sb.auth.getSession();
    try {
      const res = await fetch(TRANSFER_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          access_token: session.access_token,
          employee_id: o.employee_id,
          new_position_id: TRANSFER_MATCH.id,
          appointment_type: 'transfer',
        }),
      });
      const result = await res.json();
      if (!res.ok) { msg.style.color = '#C0392B'; msg.textContent = result.error || 'Transfer failed.'; return; }
      msg.style.color = 'var(--green)'; msg.textContent = `Moved to ${result.position_code}.`;
      await loadEverything();
      closePanel();
    } catch (e) { msg.style.color = '#C0392B'; msg.textContent = 'Network error.'; }
  };

  function currentFiltered() {
    return ALL_POSITIONS.filter(p => {
      if (SELECTED_ROLE !== 'all' && p.role_code !== SELECTED_ROLE) return false;
      if (SELECTED_REGION !== 'all' && p.region !== SELECTED_REGION) return false;
      if (SELECTED_DISTRICT !== 'all' && districtLabel(p) !== SELECTED_DISTRICT) return false;
      return true;
    });
  }

  function renderTables() {
    const filtered = currentFiltered();
    const groups = {};
    filtered.forEach(p => {
      const key = districtLabel(p);
      if (!groups[key]) groups[key] = { region: p.region, rows: [] };
      groups[key].rows.push(p);
    });

    const rowClass = CAN_EDIT ? 'statusRow' : 'statusRow noActions';
    let html = '';
    Object.keys(groups).sort().forEach(district => {
      const { region, rows } = groups[district];
      html += `<div class="districtGroup"><h3>${district}</h3><span class="regionTag">${region || ''}</span><div class="statusTable">`;
      html += `<div class="${rowClass} headerRow"><div>Position Code</div><div>Role</div><div>Geography</div><div>Status</div><div>Occupant</div>${CAN_EDIT ? '<div>Actions</div>' : ''}</div>`;
      rows.forEach(p => {
        html += `
          <div class="${rowClass}">
            <div class="code">${p.position_code}</div>
            <div><span class="roleTag">${p.role_code}</span></div>
            <div>${geoLabel(p)}</div>
            <div><span class="statusPill2 ${p.status}">${p.status === 'active' ? 'Filled' : 'Vacant'}</span></div>
            <div>${occupantHtml(p)}</div>
            ${CAN_EDIT ? `<div>${actionsHtml(p)}</div>` : ''}
            ${OPEN_PANEL && OPEN_PANEL.positionId === p.id
              ? (OPEN_PANEL.type === 'terminate' ? terminatePanelHtml(p) : transferPanelHtml(p))
              : ''}
          </div>
        `;
      });
      html += `</div></div>`;
    });
    document.getElementById('tablesArea').innerHTML = html || `<div class="statusTable"><div class="statusRow"><div>No positions match this filter.</div></div></div>`;

    if (OPEN_PANEL && OPEN_PANEL.type === 'transfer') {
      renderTransferGeoSteps();
      renderTransferMatch();
    }
  }

  function selectRole(roleCode) {
    SELECTED_ROLE = roleCode;
    OPEN_PANEL = null;
    document.querySelectorAll('.roleChip').forEach(c => c.classList.toggle('selected', c.dataset.role === roleCode));
    updateFilterHint();
    renderTables();
  }

  function updateFilterHint() {
    const parts = [];
    parts.push(SELECTED_ROLE === 'all' ? 'all roles' : SELECTED_ROLE + ' only');
    if (SELECTED_REGION !== 'all') parts.push(SELECTED_REGION);
    if (SELECTED_DISTRICT !== 'all') parts.push(SELECTED_DISTRICT);
    document.getElementById('filterLabel').textContent = parts.join(' · ');
  }

  function populateDistrictSelect() {
    const sel = document.getElementById('districtSelect');
    const inRegion = SELECTED_REGION === 'all' ? ALL_POSITIONS : ALL_POSITIONS.filter(p => p.region === SELECTED_REGION);
    const districts = [...new Set(inRegion.map(p => districtLabel(p)))].sort();
    sel.innerHTML = `<option value="all">All Districts</option>` + districts.map(d => `<option value="${d}">${d}</option>`).join('');
    sel.value = SELECTED_DISTRICT;
  }

  async function loadEverything() {
    const [positions, { data: { session } }] = await Promise.all([
      fetchAllRows(() => fbcSb.from('fbc_positions').select(`
        id, position_code, status,
        fbc_roles(code),
        states(name), districts(name, region), revenue_divisions(name), mandals(name), villages(name)
      `).order('position_code')),
      VIPL.sb.auth.getSession(),
    ]);

    let roster = [];
    try {
      const res = await fetch(ROSTER_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: session.access_token }),
      });
      const result = await res.json();
      if (res.ok) roster = result.roster || [];
    } catch (e) {}

    ROSTER_BY_POSITION = {};
    roster.forEach(r => { ROSTER_BY_POSITION[r.position_id] = r; });

    ALL_POSITIONS = (positions || []).map(p => ({
      id: p.id, position_code: p.position_code, status: p.status,
      role_code: p.fbc_roles ? p.fbc_roles.code : '',
      state_name: p.states ? p.states.name : '',
      district_name: p.districts ? p.districts.name : '',
      region: p.districts ? p.districts.region : null,
      revenue_division_name: p.revenue_divisions ? p.revenue_divisions.name : '',
      mandal_name: p.mandals ? p.mandals.name : '',
      village_name: p.villages ? p.villages.name : '',
    }));
    ALL_VACANT = ALL_POSITIONS.filter(p => p.status === 'vacant');
  }

  window.onVIPLReady = async function() {
    const role = VIPL.profile.role;
    const el = document.getElementById('fbcDashContent');

    if (!FBC_DASH_VIEW_ROLES.includes(role)) {
      el.innerHTML = `<div class="accessBox"><div class="emoji">🔒</div><h2>Restricted</h2><p>This dashboard is visible to Super Admin, Admin, HR Manager, Investors, and Directors.</p></div>`;
      return;
    }
    CAN_EDIT = FBC_DASH_EDIT_ROLES.includes(role);

    el.innerHTML = `
      <div class="scopeNote">✅ Statewide — all 28 Andhra Pradesh districts.</div>
      <div class="draftNote">⚠️ BD district clusters (7 seats, up to 6 districts each) are draft geographic defaults, not a confirmed business decision — reassignable anytime since no one's appointed to most yet.</div>
      ${!CAN_EDIT ? `<div class="viewOnlyNote">👁️ View-only — Transfer and Terminate are restricted to Super Admin, Admin, and HR Manager.</div>` : ''}
      <div id="dashBody">Loading…</div>
    `;

    try {
      await loadEverything();
    } catch (e) {
      document.getElementById('dashBody').innerHTML = `<div class="accessBox"><p>Couldn't load dashboard: ${e.message}</p></div>`;
      return;
    }

    const total = ALL_POSITIONS.length;
    const vacant = ALL_POSITIONS.filter(p => p.status === 'vacant').length;
    const active = ALL_POSITIONS.filter(p => p.status === 'active').length;
    const byRole = {};
    ALL_POSITIONS.forEach(p => { byRole[p.role_code] = (byRole[p.role_code] || 0) + 1; });

    document.getElementById('dashBody').innerHTML = `
      <div class="statsGrid">
        <div class="statBox"><div class="v">${total}</div><div class="l">Total Positions</div></div>
        <div class="statBox vacant"><div class="v">${vacant}</div><div class="l">Vacant</div></div>
        <div class="statBox active"><div class="v">${active}</div><div class="l">Filled</div></div>
      </div>
      <div class="filterBar">
        <select id="regionSelect">
          <option value="all">All Regions</option>
          ${REGION_ORDER.map(r => `<option value="${r}">${r}</option>`).join('')}
        </select>
        <select id="districtSelect"></select>
      </div>
      <div class="roleBreakdown" id="roleChips">
        <div class="roleChip selected" data-role="all">All <span class="n">${total}</span></div>
        ${ROLE_ORDER.filter(r => byRole[r]).map(r => `<div class="roleChip" data-role="${r}">${r} <span class="n">${byRole[r]}</span></div>`).join('')}
      </div>
      <div class="filterHint">Showing: <span id="filterLabel">all roles</span></div>
      <div id="tablesArea"></div>
    `;
    document.querySelectorAll('.roleChip').forEach(chip => { chip.onclick = () => selectRole(chip.dataset.role); });

    populateDistrictSelect();
    document.getElementById('regionSelect').onchange = (e) => {
      SELECTED_REGION = e.target.value;
      SELECTED_DISTRICT = 'all';
      populateDistrictSelect();
      updateFilterHint();
      renderTables();
    };
    document.getElementById('districtSelect').onchange = (e) => {
      SELECTED_DISTRICT = e.target.value;
      updateFilterHint();
      renderTables();
    };

    renderTables();
  };
</script>
</body>
</html>
