<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIPL Internal — FBC Employees</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 24px; margin-top: -12px; }

  .hireCard { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 26px; max-width: 640px; }
  .stepBlock { margin-bottom: 20px; }
  .stepBlock.hidden { display: none; }
  .stepLabel { font-size: 12.5px; font-weight: 700; color: var(--g3); display: block; margin-bottom: 6px; }
  .stepBlock select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14.5px; font-family: inherit; background: #fff; color: var(--ink); box-sizing: border-box;
  }

  .matchBox { background: var(--off); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .matchBox .code { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px; color: var(--blue); }
  .matchBox .meta { font-size: 12.5px; color: var(--g3); margin-top: 2px; }

  .pickList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .pickRow {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background .12s;
  }
  .pickRow:hover { background: var(--off); }
  .pickRow.selected { background: #E3F5F3; border-color: #0E9488; }
  .pickRow .code { font-weight: 700; font-size: 13px; color: var(--ink); }
  .pickRow .meta { font-size: 11.5px; color: var(--g3); }

  .noneMsg { font-size: 13px; color: var(--g3); background: var(--off); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }

  .hireFormFields { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 4px; }
  .hireFormFields input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; font-size: 14px; font-family: inherit; background: #fff; box-sizing: border-box;
  }
  .hireFormFields label { font-size: 12px; font-weight: 700; color: var(--g3); display: block; margin-bottom: 4px; }
  .formRow { margin-bottom: 12px; }
  .formGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hireFormFields button {
    padding: 11px 20px; border-radius: 8px; background: var(--blue); color: #fff; border: none;
    font-weight: 700; cursor: pointer; font-size: 14px; margin-top: 6px;
  }
  .hireFormFields button:disabled { opacity: .6; cursor: default; }
  .resetBtn { background: var(--off); color: var(--ink); margin-left: 8px; }
  #hireMsg { font-size: 13px; margin-top: 12px; }

  .accessBox { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px; text-align: center; max-width: 480px; margin: 40px auto; }
  .accessBox .emoji { font-size: 40px; margin-bottom: 12px; }
  .accessBox h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .accessBox p { font-size: 13.5px; color: var(--g3); line-height: 1.5; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">FBC Employees</h1>
    <div class="lead">Pick a role, narrow down to the position, hire — top to bottom, no scrolling through a list.</div>
    <div id="fbcContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  const FBC_ALLOWED_ROLES = ['super_admin', 'hr_manager'];

  const FBC_URL = 'https://uwoptohruurhbhatwkiz.supabase.co';
  const FBC_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3b3B0b2hydXVyaGJoYXR3a2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzA0OTgsImV4cCI6MjEwMTAwNjQ5OH0.5pPk1JNy1xm2NCD9Xv6rZpDrf-jprFwaXtRk4WshL18';
  const fbcSb = supabase.createClient(FBC_URL, FBC_ANON_KEY);
  const HIRE_ENDPOINT = FBC_URL + '/functions/v1/hire-fbc-employee';

  // Which geography levels each role needs, in order.
  const ROLE_GEO_STEPS = {
    CEO: [],
    BD:  [],
    ZM:  ['district'],
    RM:  ['district', 'division'],
    BDM: ['district', 'division', 'mandal'],
    MM:  ['district', 'division', 'mandal', 'village'],
    FO:  ['district', 'division', 'mandal', 'village'],
  };
  const STEP_LABELS = { district: 'District', division: 'Revenue Division', mandal: 'Mandal', village: 'Village' };

  let ALL_VACANT = [];
  let SELECTION = { role: '', district: '', division: '', mandal: '', village: '' };
  let MATCHED_POSITION = null;

  function uniqueValues(list, key) {
    return [...new Set(list.map(p => p[key]).filter(Boolean))].sort();
  }

  function filterBySelection() {
    return ALL_VACANT.filter(p => {
      if (SELECTION.role && p.role_code !== SELECTION.role) return false;
      if (SELECTION.district && p.district_name !== SELECTION.district) return false;
      if (SELECTION.division && p.revenue_division_name !== SELECTION.division) return false;
      if (SELECTION.mandal && p.mandal_name !== SELECTION.mandal) return false;
      if (SELECTION.village && p.village_name !== SELECTION.village) return false;
      return true;
    });
  }

  function renderFlow() {
    const container = document.getElementById('flowSteps');
    const steps = ROLE_GEO_STEPS[SELECTION.role] || [];
    let html = '';

    // Geography dropdowns, one at a time, each populated from positions matching everything selected so far.
    let runningFilter = { role: SELECTION.role };
    for (const step of steps) {
      const candidatePositions = ALL_VACANT.filter(p => {
        if (runningFilter.role && p.role_code !== runningFilter.role) return false;
        if (runningFilter.district && p.district_name !== runningFilter.district) return false;
        if (runningFilter.division && p.revenue_division_name !== runningFilter.division) return false;
        if (runningFilter.mandal && p.mandal_name !== runningFilter.mandal) return false;
        return true;
      });
      const key = step === 'district' ? 'district_name' : step === 'division' ? 'revenue_division_name' : step === 'mandal' ? 'mandal_name' : 'village_name';
      const options = uniqueValues(candidatePositions, key);

      html += `
        <div class="stepBlock">
          <label class="stepLabel">${STEP_LABELS[step]}</label>
          <select data-step="${step}">
            <option value="">Select ${STEP_LABELS[step].toLowerCase()}…</option>
            ${options.map(o => `<option value="${o}" ${SELECTION[step] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>
      `;
      runningFilter[step] = SELECTION[step];
      if (!SELECTION[step]) break; // don't reveal the next dropdown until this one's chosen
    }

    container.innerHTML = html;
    container.querySelectorAll('select').forEach(sel => {
      sel.onchange = () => {
        const step = sel.dataset.step;
        SELECTION[step] = sel.value;
        // Clear anything deeper than this step since its options are now stale.
        const order = ['district', 'division', 'mandal', 'village'];
        const idx = order.indexOf(step);
        order.slice(idx + 1).forEach(k => SELECTION[k] = '');
        MATCHED_POSITION = null;
        renderFlow();
        renderMatch();
      };
    });
  }

  function renderMatch() {
    const box = document.getElementById('matchArea');
    if (!SELECTION.role) { box.innerHTML = ''; return; }

    const steps = ROLE_GEO_STEPS[SELECTION.role] || [];
    const allStepsChosen = steps.every(s => SELECTION[s]);
    if (!allStepsChosen) { box.innerHTML = ''; document.getElementById('hireFormArea').innerHTML = ''; return; }

    const matches = filterBySelection();
    if (!matches.length) {
      box.innerHTML = `<div class="noneMsg">No vacant position here — everything in this selection is already filled, or doesn't exist yet.</div>`;
      document.getElementById('hireFormArea').innerHTML = '';
      return;
    }

    if (matches.length === 1) {
      MATCHED_POSITION = matches[0];
      box.innerHTML = `
        <div class="matchBox">
          <div class="code">${MATCHED_POSITION.position_code}</div>
          <div class="meta">${MATCHED_POSITION.role_code} · ${geoLabel(MATCHED_POSITION)}</div>
        </div>
      `;
      renderHireForm();
    } else {
      box.innerHTML = `<label class="stepLabel">Multiple open seats here — pick one</label><div class="pickList" id="pickList"></div>`;
      const pickList = document.getElementById('pickList');
      pickList.innerHTML = matches.map(p => `
        <div class="pickRow" data-id="${p.id}">
          <div><div class="code">${p.position_code}</div><div class="meta">${geoLabel(p)}</div></div>
        </div>
      `).join('');
      pickList.querySelectorAll('.pickRow').forEach(row => {
        row.onclick = () => {
          MATCHED_POSITION = matches.find(m => m.id === row.dataset.id);
          pickList.querySelectorAll('.pickRow').forEach(r => r.classList.toggle('selected', r === row));
          renderHireForm();
        };
      });
      document.getElementById('hireFormArea').innerHTML = '';
    }
  }

  function geoLabel(p) {
    const parts = [];
    if (p.village_name) parts.push(p.village_name + ' village');
    else if (p.mandal_name) parts.push(p.mandal_name + ' mandal');
    else if (p.revenue_division_name) parts.push(p.revenue_division_name + ' division');
    else if (p.district_name) parts.push(p.district_name + ' district');
    else if (p.state_name) parts.push(p.state_name);
    return parts.join(', ') || '—';
  }

  function renderHireForm() {
    const area = document.getElementById('hireFormArea');
    if (!MATCHED_POSITION) { area.innerHTML = ''; return; }
    area.innerHTML = `
      <div class="hireFormFields">
        <div class="formRow"><label>Full name *</label><input type="text" id="hireName" placeholder="Full name"></div>
        <div class="formGrid">
          <div class="formRow"><label>Phone</label><input type="tel" id="hirePhone" placeholder="Phone number"></div>
          <div class="formRow"><label>Email</label><input type="email" id="hireEmail" placeholder="Email address"></div>
        </div>
        <div class="formGrid">
          <div class="formRow"><label>Hire date</label><input type="date" id="hireDate" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="formRow"><label>Emergency contact</label><input type="text" id="hireEmergency" placeholder="Name & phone"></div>
        </div>
        <button id="hireSubmitBtn">Hire into ${MATCHED_POSITION.position_code}</button>
        <button class="resetBtn" id="resetBtn">Start over</button>
        <div id="hireMsg"></div>
      </div>
    `;
    document.getElementById('hireSubmitBtn').onclick = submitHire;
    document.getElementById('resetBtn').onclick = resetFlow;
  }

  function resetFlow() {
    SELECTION = { role: '', district: '', division: '', mandal: '', village: '' };
    MATCHED_POSITION = null;
    document.getElementById('roleSelect').value = '';
    document.getElementById('flowSteps').innerHTML = '';
    document.getElementById('matchArea').innerHTML = '';
    document.getElementById('hireFormArea').innerHTML = '';
  }

  async function submitHire() {
    const msg = document.getElementById('hireMsg');
    const full_name = document.getElementById('hireName').value.trim();
    const phone = document.getElementById('hirePhone').value.trim();
    const email = document.getElementById('hireEmail').value.trim();
    const hire_date = document.getElementById('hireDate').value;
    const emergency_contact = document.getElementById('hireEmergency').value.trim();

    if (!full_name) { msg.style.color = '#C0392B'; msg.textContent = 'Full name is required.'; return; }

    const btn = document.getElementById('hireSubmitBtn');
    btn.disabled = true;
    msg.style.color = 'var(--g3)'; msg.textContent = 'Hiring…';

    const { data: { session } } = await VIPL.sb.auth.getSession();
    if (!session) { msg.style.color = '#C0392B'; msg.textContent = 'Session expired — please sign in again.'; btn.disabled = false; return; }

    try {
      const res = await fetch(HIRE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          access_token: session.access_token,
          full_name, phone: phone || null, email: email || null,
          hire_date: hire_date || null, emergency_contact: emergency_contact || null,
          position_id: MATCHED_POSITION.id,
        }),
      });
      const result = await res.json();
      if (!res.ok) {
        msg.style.color = '#C0392B'; msg.textContent = result.error || 'Hire failed.'; btn.disabled = false; return;
      }
      msg.style.color = 'var(--green)';
      msg.textContent = `Hired! ${result.employee.employee_code} — ${full_name} — now in ${result.position_code}.`;
      await loadVacantPositions();
      setTimeout(resetFlow, 1800);
    } catch (e) {
      msg.style.color = '#C0392B'; msg.textContent = 'Network error — please try again.';
    }
    btn.disabled = false;
  }

  async function loadVacantPositions() {
    const { data, error } = await fbcSb
      .from('fbc_positions')
      .select(`
        id, position_code, status,
        fbc_roles(code),
        states(name), districts(name), revenue_divisions(name), mandals(name)
      `)
      .eq('status', 'vacant')
      .order('position_code');

    if (error) {
      document.getElementById('fbcContent').innerHTML = `<div class="accessBox"><p>Couldn't load positions: ${error.message}</p></div>`;
      return;
    }
    ALL_VACANT = (data || []).map(p => ({
      id: p.id, position_code: p.position_code,
      role_code: p.fbc_roles ? p.fbc_roles.code : '',
      state_name: p.states ? p.states.name : '',
      district_name: p.districts ? p.districts.name : '',
      revenue_division_name: p.revenue_divisions ? p.revenue_divisions.name : '',
      mandal_name: p.mandals ? p.mandals.name : '',
      village_name: null, // villages not seeded yet
    }));
  }

  window.onVIPLReady = async function() {
    const role = VIPL.profile.role;
    const el = document.getElementById('fbcContent');

    if (!FBC_ALLOWED_ROLES.includes(role)) {
      el.innerHTML = `
        <div class="accessBox">
          <div class="emoji">🔒</div>
          <h2>Restricted to HR Manager / Super Admin</h2>
          <p>Only HR Manager or Super Admin can hire FBC Network employees.</p>
        </div>
      `;
      return;
    }

    await loadVacantPositions();

    const roleCounts = {};
    ALL_VACANT.forEach(p => { roleCounts[p.role_code] = (roleCounts[p.role_code] || 0) + 1; });
    const roleOrder = ['CEO','BD','ZM','RM','BDM','MM','FO'];

    el.innerHTML = `
      <div class="hireCard">
        <div class="stepBlock">
          <label class="stepLabel">Which role are you hiring for?</label>
          <select id="roleSelect">
            <option value="">Select role…</option>
            ${roleOrder.filter(r => roleCounts[r]).map(r => `<option value="${r}">${r} (${roleCounts[r]} vacant)</option>`).join('')}
          </select>
        </div>
        <div id="flowSteps"></div>
        <div id="matchArea"></div>
        <div id="hireFormArea"></div>
      </div>
    `;

    document.getElementById('roleSelect').onchange = (e) => {
      SELECTION = { role: e.target.value, district: '', division: '', mandal: '', village: '' };
      MATCHED_POSITION = null;
      renderFlow();
      renderMatch();
    };
  };
</script>
</body>
</html>
