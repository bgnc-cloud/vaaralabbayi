<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIPL Internal — Overview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 28px; margin-top: -12px; }

  /* ---- Summary stat cards ---- */
  .summaryGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 14px; margin-bottom: 28px; }
  .summaryBox {
    background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    position: relative; overflow: hidden;
  }
  .summaryBox::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #CBD5E1;
  }
  .summaryBox.accent-cash::before    { background: #94A3B8; }
  .summaryBox.accent-bank::before    { background: #94A3B8; }
  .summaryBox.accent-capital::before { background: #0E9488; }
  .summaryBox.accent-loan::before    { background: #B7791F; }
  .summaryBox .icon {
    width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-bottom: 12px; background: #F1F3F6; color: #475467;
  }
  .summaryBox.accent-capital .icon { background: #E3F5F3; color: #0E9488; }
  .summaryBox.accent-loan .icon    { background: #FBF1DE; color: #B7791F; }
  .summaryBox .val {
    font-family:'Plus Jakarta Sans',sans-serif; font-size: 26px; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
  }
  .summaryBox .lbl { font-size: 12.5px; color: var(--g3); margin-top: 4px; }
  .welcomeBox {
    background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .welcomeBox .wave { font-size: 28px; }
  .welcomeBox .lbl { font-size: 14.5px; color: var(--ink); font-weight: 600; }

  /* ---- Quick access cards ---- */
  .quickGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 16px; }
  .quickCard {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px;
    text-decoration: none; color: var(--ink); transition: all .18s; display: flex; flex-direction: column; gap: 4px;
  }
  .quickCard:hover { border-color: var(--blue); box-shadow: 0 8px 20px rgba(13,35,64,.08); transform: translateY(-1px); }
  .quickCard .icon {
    width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 19px; margin-bottom: 10px; background: #F1F3F6;
  }
  .quickCard .title { font-weight: 800; font-size: 15px; margin-bottom: 2px; }
  .quickCard .desc { font-size: 13px; color: var(--g3); line-height: 1.5; }
  .quickCard .goArrow {
    margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--blue); display: flex; align-items: center; gap: 4px;
    opacity: 0; transform: translateX(-4px); transition: all .18s;
  }
  .quickCard:hover .goArrow { opacity: 1; transform: translateX(0); }
  .quickCard.soonCard { opacity: .55; cursor: default; }
  .quickCard.soonCard:hover { border-color: var(--border); box-shadow: none; transform: none; }
  .quickCard .soonTag {
    display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase;
    background: #F1F3F6; color: var(--g3); padding: 2px 7px; border-radius: 5px; margin-top: 8px; width: fit-content;
  }

  @media (max-width: 600px) {
    .summaryGrid, .quickGrid { gap: 10px; }
    .summaryBox, .quickCard { padding: 16px; }
    .summaryBox .val { font-size: 21px; }
  }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">Overview</h1>
    <div class="lead">Welcome to VIPL Internal. Live snapshot of the business below.</div>
    <div class="summaryGrid" id="topSummary"></div>
    <div class="quickGrid" id="quickGrid"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  function fmt(n) { return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:0}); }

  const CARD_META = {
    'ledger.html':          { icon:'📒', accent:'#0E9488', bg:'#E3F5F3' },
    'dashboard.html':       { icon:'📊', accent:'#5B4FCF', bg:'#EDECFC' },
    'investor-portal.html': { icon:'📈', accent:'#0E9488', bg:'#E3F5F3' },
    'loan-portal.html':     { icon:'💳', accent:'#B7791F', bg:'#FBF1DE' },
  };

  window.onVIPLReady = async function() {
    const role = VIPL.profile.role;
    const canSeeFinance = ['super_admin','accountant','investor','director_1','director_2'].includes(role);

    if (canSeeFinance) {
      const [{ data: balances }, { data: totalsRow }, { data: loans }] = await Promise.all([
        VIPL.sb.from('current_balances').select('cash_balance,bank_balance').single(),
        VIPL.sb.from('investor_totals').select('*').single(),
        VIPL.sb.from('loan_tracker').select('running_balance').order('month_start',{ascending:false}).limit(1)
      ]);
      const cash = balances ? balances.cash_balance : 0;
      const bank = balances ? balances.bank_balance : 0;
      const totalInvested = totalsRow ? totalsRow.total_cash_invested : 0;
      const loanBal = loans && loans[0] ? loans[0].running_balance : 0;
      document.getElementById('topSummary').innerHTML = `
        <div class="summaryBox accent-cash"><div class="icon">₹</div><div class="val">${fmt(cash)}</div><div class="lbl">Cash Balance</div></div>
        <div class="summaryBox accent-bank"><div class="icon">🏦</div><div class="val">${fmt(bank)}</div><div class="lbl">Bank Balance</div></div>
        <div class="summaryBox accent-capital"><div class="icon">📈</div><div class="val">${fmt(totalInvested)}</div><div class="lbl">Total Investor Capital</div></div>
        <div class="summaryBox accent-loan"><div class="icon">💳</div><div class="val">${fmt(loanBal)}</div><div class="lbl">Loan Outstanding</div></div>
      `;
    } else {
      document.getElementById('topSummary').innerHTML = `
        <div class="welcomeBox"><div class="wave">👋</div><div class="lbl">Welcome, ${VIPL.profile.full_name || VIPL.user.email}</div></div>
      `;
    }

    const cards = [];
    if (['super_admin','accountant','entry'].includes(role)) cards.push({ href:'ledger.html', icon:'📒', title:'Ledger Entry', desc:'Add daily cash/bank transactions and view the full ledger.' });
    if (['super_admin','accountant'].includes(role)) cards.push({ href:'dashboard.html', icon:'📊', title:'Financial Dashboard', desc:'Category breakdown, loan tracker, investor capital.' });
    if (['super_admin','accountant','investor','director_1','director_2'].includes(role)) cards.push({ href:'investor-portal.html', icon:'📈', title:'Investor Portal', desc:'Cap table, investor share, expenses, profit/loss.' });
    if (['super_admin','accountant','investor','director_1','director_2'].includes(role)) cards.push({ href:'loan-portal.html', icon:'💳', title:'Loan Portal', desc:'Director and external loans, repayment tracking, contacts.' });
    if (role === 'super_admin') {
      cards.push({ soon:true, icon:'🏪', title:'Stores Module', desc:'Digital Store operations — coming next.' });
    }
    document.getElementById('quickGrid').innerHTML = cards.map(c => {
      if (c.soon) {
        return `<div class="quickCard soonCard"><div class="icon">${c.icon}</div><div class="title">${c.title}</div><div class="desc">${c.desc}</div><span class="soonTag">Soon</span></div>`;
      }
      const meta = CARD_META[c.href] || { bg:'#F1F3F6' };
      return `<a class="quickCard" href="${c.href}"><div class="icon" style="background:${meta.bg}">${c.icon}</div><div class="title">${c.title}</div><div class="desc">${c.desc}</div><div class="goArrow">Open →</div></a>`;
    }).join('');
  };
</script>
</body>
</html>
