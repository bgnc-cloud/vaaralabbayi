<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>People & Roles — VIPL Internal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 24px; margin-top: -12px; }
  #noAccess { text-align: center; padding: 60px 20px; color: var(--g3); }

  .summaryGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 14px; margin-bottom: 28px; }
  .summaryBox { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px; position: relative; overflow: hidden; }
  .summaryBox::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:#0E9488; }
  .summaryBox .val { font-family:'Plus Jakarta Sans',sans-serif; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .summaryBox .lbl { font-size: 11.5px; color: var(--g3); margin-top: 4px; }
  .noteBox { font-size: 12px; color: var(--g3); background: var(--off); border-radius: 8px; padding: 10px 14px; margin-bottom: 24px; line-height: 1.5; }

  .sectionTitle { font-family:'Plus Jakarta Sans',sans-serif; font-size: 16px; font-weight: 800; margin: 8px 0 14px; }

  .catGrid { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 14px; margin-bottom: 28px; }
  .catCard {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer;
    transition: all .15s; text-align: left;
  }
  .catCard:hover { border-color: var(--blue); box-shadow: 0 6px 16px rgba(13,35,64,.08); }
  .catCard.active { border-color: var(--blue); background: #F0F7FF; }
  .catCard .catIcon { font-size: 22px; margin-bottom: 8px; }
  .catCard .catCount { font-family:'Plus Jakarta Sans',sans-serif; font-size: 22px; font-weight: 800; }
  .catCard .catLabel { font-size: 12.5px; color: var(--g3); font-weight: 600; margin-top: 2px; }

  .peopleTableWrap { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 28px; }
  table.peopleTable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.peopleTable th {
    text-align: left; padding: 11px 16px; background: #FAFBFC; color: var(--g3);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  table.peopleTable td { padding: 12px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  table.peopleTable tbody tr:hover { background: #FAFBFD; }

  .personCell { display: flex; align-items: center; gap: 10px; }
  .personAvatar { width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .personName { font-weight: 700; }
  .personId { font-family: monospace; font-size: 11.5px; color: var(--g3); }

  .pill { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 6px; background: var(--off); color: var(--g3); }
  .pill.inactive { background: #FEE2E2; color: #C0392B; }

  .lastLogin { display: flex; align-items: center; gap: 6px; }
  .loginDot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .loginDot.recent { background: var(--green); }
  .loginDot.moderate { background: #B7791F; }
  .loginDot.stale { background: #9AA5B1; }
  .loginTime { font-size: 12.5px; }
  .loginTimeSub { font-size: 11px; color: var(--g3); }

  .lenderTableWrap { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table.lenderTable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.lenderTable th {
    text-align: left; padding: 11px 16px; background: #FAFBFC; color: var(--g3);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  table.lenderTable td { padding: 12px 16px; border-top: 1px solid var(--border); vertical-align: middle; font-variant-numeric: tabular-nums; }
  table.lenderTable tbody tr:hover { background: #FAFBFD; }
  .balNeg { color: #C0392B; font-weight: 700; }
  .balPos { color: var(--green); font-weight: 700; }
  .relatedBadge { font-size: 9.5px; font-weight: 800; letter-spacing: .3px; background: #FBF1DE; color: #B7791F; padding: 2px 8px; border-radius: 5px; margin-left: 8px; }
  .linkedBadge { font-size: 9.5px; font-weight: 800; letter-spacing: .3px; background: #E3F5F3; color: #0E9488; padding: 2px 8px; border-radius: 5px; margin-left: 8px; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">People & Roles</h1>
    <div class="lead">Everyone with a login, grouped by role category, with recent login activity.</div>
    <div id="pageContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  const ALLOWED_ROLES = ['super_admin','accountant'];
  const CATEGORY_META = {
    system:        { label: 'System / Super Admin',    icon: '⚙️' },
    admin_staff:   { label: 'Admin & Management',       icon: '🧑‍💼' },
    investor:      { label: 'Investors & Directors',    icon: '📈' },
    fico:          { label: 'FICO Investors',           icon: '💰' },
    fbc:           { label: 'FBC Team',                 icon: '🎯' },
    warehouse:     { label: 'Warehouse',                icon: '📦' },
    dark_store:    { label: 'Dark Store',                icon: '🏬' },
    digital_store: { label: 'Digital Store',            icon: '🏪' },
    supply_chain:  { label: 'Supply Chain',             icon: '🚚' },
    subscriber:    { label: 'Subscribers',              icon: '👥' }
  };

  function initials(s) { return (s||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function sameLocalDay(d1, d2) { return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }
  function daysAgo(dateStr) { if (!dateStr) return Infinity; return (new Date() - new Date(dateStr)) / 86400000; }
  // Calendar-day difference (not a rolling 24h window) — so "1 day ago" always means
  // "yesterday's calendar date," consistent with how "Active Today" is calculated above,
  // rather than a raw millisecond count that can say "0 days ago" for a login that
  // happened yesterday just because it was within the last 24 hours.
  function calendarDaysAgo(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    const now = new Date();
    const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const now0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((now0 - d0) / 86400000);
  }

  let allRoles = [];
  let roleCategoryMap = {};
  let roleNameMap = {};
  let allPeople = [];
  let allLenders = [];
  let activeCategory = null;

  window.onVIPLReady = async function() {
    if (!ALLOWED_ROLES.includes(VIPL.profile.role)) {
      document.getElementById('pageContent').innerHTML = '<div id="noAccess">🔒 No access to this page. Limited to Super Admin and Accountant accounts.</div>';
      return;
    }

    document.getElementById('pageContent').innerHTML = `<div style="text-align:center;color:var(--g3);padding:40px">Loading…</div>`;

    const [{ data: roles }, { data: people, error: peopleErr }, { data: lenders }] = await Promise.all([
      VIPL.sb.from('roles').select('code, name, category'),
      VIPL.sb.rpc('get_user_login_activity'),
      VIPL.sb.from('loan_accounts').select('*').order('balance', { ascending: false })
    ]);

    allRoles = roles || [];
    roleCategoryMap = Object.fromEntries(allRoles.map(r => [r.code, r.category]));
    roleNameMap = Object.fromEntries(allRoles.map(r => [r.code, r.name]));
    allPeople = (people || []).filter(p => p.role !== 'pending');
    allLenders = lenders || [];

    if (peopleErr) {
      document.getElementById('pageContent').innerHTML = `<div class="noteBox" style="color:#C0392B">Error loading login activity: ${peopleErr.message}</div>`;
      return;
    }

    render();
  };

  function render() {
    const now = new Date();
    const today = allPeople.filter(p => p.last_sign_in_at && sameLocalDay(new Date(p.last_sign_in_at), now)).length;
    const last7 = allPeople.filter(p => daysAgo(p.last_sign_in_at) <= 7).length;
    const last30 = allPeople.filter(p => daysAgo(p.last_sign_in_at) <= 30).length;
    const last90 = allPeople.filter(p => daysAgo(p.last_sign_in_at) <= 90).length;
    const last365 = allPeople.filter(p => daysAgo(p.last_sign_in_at) <= 365).length;
    const neverLoggedIn = allPeople.filter(p => !p.last_sign_in_at).length;

    let html = `
      <div class="noteBox">ℹ️ Supabase only stores each account's <strong>most recent</strong> sign-in — not a full login history. So the figures below mean "last signed in within this window," not "number of logins in this period."</div>
      <div class="sectionTitle">Login Activity</div>
      <div class="summaryGrid">
        <div class="summaryBox"><div class="val">${allPeople.length}</div><div class="lbl">Total Accounts</div></div>
        <div class="summaryBox"><div class="val">${today}</div><div class="lbl">Active Today</div></div>
        <div class="summaryBox"><div class="val">${last7}</div><div class="lbl">Active — Last 7 Days</div></div>
        <div class="summaryBox"><div class="val">${last30}</div><div class="lbl">Active — Last 30 Days</div></div>
        <div class="summaryBox"><div class="val">${last90}</div><div class="lbl">Active — Last 90 Days</div></div>
        <div class="summaryBox"><div class="val">${last365}</div><div class="lbl">Active — Last 365 Days</div></div>
      </div>

      <div class="sectionTitle">By Role Category</div>
      <div class="catGrid" id="catGrid"></div>
      <div id="peopleSection"></div>

      <div class="sectionTitle">Lenders <span style="font-weight:600;color:var(--g3);font-size:13px">(${allLenders.length} — from Loan Portal, separate from logins)</span></div>
      <div class="lenderTableWrap"><table class="lenderTable">
        <thead><tr><th>Lender</th><th>Borrowed</th><th>Repaid</th><th>Balance</th><th>Phone</th></tr></thead>
        <tbody id="lenderTableBody"></tbody>
      </table></div>
    `;
    document.getElementById('pageContent').innerHTML = html;

    // Category cards
    const catCounts = {};
    allPeople.forEach(p => {
      const cat = roleCategoryMap[p.role] || 'other';
      catCounts[cat] = (catCounts[cat] || 0) + 1;
    });
    const catsToShow = Object.keys(CATEGORY_META).filter(c => catCounts[c] || c === activeCategory);
    document.getElementById('catGrid').innerHTML = catsToShow.map(cat => `
      <button class="catCard${cat === activeCategory ? ' active' : ''}" onclick="selectCategory('${cat}')">
        <div class="catIcon">${CATEGORY_META[cat].icon}</div>
        <div class="catCount">${catCounts[cat] || 0}</div>
        <div class="catLabel">${CATEGORY_META[cat].label}</div>
      </button>
    `).join('') + `
      <button class="catCard${activeCategory === null ? ' active' : ''}" onclick="selectCategory(null)">
        <div class="catIcon">👤</div>
        <div class="catCount">${allPeople.length}</div>
        <div class="catLabel">All People</div>
      </button>
    `;

    renderPeopleList();

    // Lenders table
    document.getElementById('lenderTableBody').innerHTML = allLenders.map(l => `
      <tr>
        <td><strong>${escapeHtml(l.lender_name)}</strong>${l.is_related_party ? '<span class="relatedBadge">DIRECTOR</span>' : ''}${l.profile_id ? '<span class="linkedBadge">LINKED</span>' : ''}</td>
        <td>₹${Number(l.total_borrowed||0).toLocaleString('en-IN')}</td>
        <td>₹${Number(l.total_repaid||0).toLocaleString('en-IN')}</td>
        <td class="${l.balance > 0 ? 'balNeg' : 'balPos'}">₹${Number(l.balance||0).toLocaleString('en-IN')}</td>
        <td>${escapeHtml(l.phone_number || '—')}</td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--g3);padding:20px">No lenders recorded.</td></tr>';
  }

  function selectCategory(cat) {
    activeCategory = cat;
    render();
  }

  function renderPeopleList() {
    const filtered = activeCategory
      ? allPeople.filter(p => (roleCategoryMap[p.role] || 'other') === activeCategory)
      : allPeople;
    const sorted = filtered.slice().sort((a,b) => daysAgo(a.last_sign_in_at) - daysAgo(b.last_sign_in_at));

    document.getElementById('peopleSection').innerHTML = `
      <div class="peopleTableWrap"><table class="peopleTable">
        <thead><tr><th>Person</th><th>Role</th><th>Department</th><th>Joined</th><th>Last Login</th><th>Status</th></tr></thead>
        <tbody>
          ${sorted.map(p => {
            const d = daysAgo(p.last_sign_in_at);
            const dotCls = d <= 7 ? 'recent' : d <= 30 ? 'moderate' : 'stale';
            const loginText = p.last_sign_in_at
              ? new Date(p.last_sign_in_at).toLocaleString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
              : 'Never logged in';
            const loginSub = p.last_sign_in_at
              ? (calendarDaysAgo(p.last_sign_in_at) === 0 ? 'Today' : calendarDaysAgo(p.last_sign_in_at) === 1 ? '1 day ago' : `${calendarDaysAgo(p.last_sign_in_at)} days ago`)
              : '';
            return `
            <tr>
              <td><div class="personCell"><div class="personAvatar">${initials(p.full_name)}</div><div><div class="personName">${escapeHtml(p.full_name || p.email)}</div><div class="personId">${escapeHtml(p.customer_id || '')} · ${escapeHtml(p.email)}</div></div></div></td>
              <td>${escapeHtml(roleNameMap[p.role] || p.role)}</td>
              <td>${escapeHtml(p.department || '—')}</td>
              <td>${p.date_of_joining || '—'}</td>
              <td><div class="lastLogin"><span class="loginDot ${dotCls}"></span><div><div class="loginTime">${loginText}</div>${loginSub ? `<div class="loginTimeSub">${loginSub}</div>` : ''}</div></div></td>
              <td>${p.is_active ? '<span class="pill">Active</span>' : '<span class="pill inactive">Inactive</span>'}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--g3);padding:24px">No one in this category yet.</td></tr>'}
        </tbody>
      </table></div>
    `;
  }
</script>
</body>
</html>
