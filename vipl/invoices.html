<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoices — VIPL Internal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
  .card h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .card .cardSub { font-size: 12.5px; color: var(--g3); margin-bottom: 18px; }
  #noAccess { text-align: center; padding: 60px 20px; color: var(--g3); }

  .fieldRow { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; margin-bottom: 16px; }
  .fieldRow label { font-size: 11.5px; font-weight: 700; color: var(--g3); text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 6px; }
  .fieldRow select, .fieldRow input, .fieldRow textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    font-family: inherit; transition: border-color .15s; box-sizing: border-box;
  }
  .fieldRow textarea { resize: vertical; min-height: 44px; }

  .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit; transition: opacity .15s; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btnPrimary { background: var(--blue); color: #fff; }
  .btnGhost { background: #fff; border: 1px solid var(--border); color: var(--ink); }
  .btnGreen { background: #EAF3DE; color: #15803D; }
  .btnAmber { background: #FBF1DE; color: #B7791F; }
  .btnDanger { background: #FEE2E2; color: #C0392B; }
  .btnSm { padding: 6px 12px; font-size: 12px; }
  .actionRow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  .collapseToggle { font-size: 12.5px; font-weight: 700; color: var(--blue); background: none; border: none; cursor: pointer; padding: 0; }

  .paymentChoice { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .paymentChoice label {
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink);
    margin: 0; flex: 1; min-width: 160px; padding: 11px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .paymentChoice label:has(input:checked) { border-color: var(--blue); background: #F0F7FF; }
  .paymentChoice input[type=radio] { width: auto; margin: 0; accent-color: var(--blue); }

  table.lineItemsTable { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  table.lineItemsTable th {
    text-align: left; padding: 8px 8px; background: #FAFBFC; color: var(--g3);
    font-size: 10px; text-transform: uppercase; letter-spacing: .4px; font-weight: 800;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  table.lineItemsTable td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.lineItemsTable input { width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; box-sizing: border-box; }
  table.lineItemsTable input.narrow { width: 70px; }
  table.lineItemsTable input.narrower { width: 56px; }
  .lineTotal { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .rmBtn { background: none; border: none; color: #C0392B; font-size: 16px; cursor: pointer; padding: 2px 6px; }

  .totalsBox { display: flex; justify-content: flex-end; }
  .totalsInner { min-width: 260px; }
  .totalsRow { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; }
  .totalsRow.grand { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 16px; }
  .totalsRow span:last-child { font-variant-numeric: tabular-nums; }

  .taxModeNote { font-size: 12.5px; color: var(--g3); background: var(--off); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .taxModeNote b { color: var(--ink); }

  table.historyTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.historyTable th {
    text-align: left; padding: 9px 10px; background: #FAFBFC; color: var(--g3);
    font-size: 10px; text-transform: uppercase; letter-spacing: .4px; font-weight: 800;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  table.historyTable td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: middle; }
  table.historyTable tr:hover td { background: #FAFBFD; }
  .emptyNote { text-align: center; color: var(--g3); padding: 24px; }
  .tableWrap { overflow-x: auto; }
  #genMsg { font-size: 13px; margin-top: 10px; font-weight: 600; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .pill.received { background: #EAF3DE; color: #15803D; }
  .pill.unpaid { background: #FFF7ED; color: #9A5B0F; }

  .modalOverlay { position: fixed; inset: 0; background: rgba(13,35,64,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modalOverlay.open { display: flex; }
  .modalBox { background: #fff; border-radius: 16px; padding: 28px; max-width: 92vw; max-height: 88vh; overflow-y: auto; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">Invoices</h1>
    <div class="lead" id="pageLead" style="font-size:14px;color:var(--g3);margin-bottom:24px;margin-top:-12px"></div>
    <div id="pageContent"></div>
  </div>
</div>

<div class="modalOverlay" id="invoiceActionModal">
  <div class="modalBox" style="width:380px">
    <h3 id="iaTitle" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;margin-bottom:4px">Invoice ready</h3>
    <div class="modalSub" id="iaSub" style="font-size:12.5px;color:var(--g3);margin-bottom:18px"></div>
    <div class="actionRow" style="flex-direction:column">
      <button class="btn btnGhost" onclick="viewGeneratedPDF()" style="width:100%">👁️ View</button>
      <button class="btn btnGreen" onclick="downloadGeneratedPDF()" style="width:100%">⬇️ Download</button>
      <button class="btn btnPrimary" onclick="shareGeneratedPDF()" style="width:100%">🔗 Share</button>
      <div id="iaFallbackShare" style="display:none;gap:10px;width:100%">
        <button class="btn btnGhost btnSm" style="flex:1" onclick="shareViaEmail()">✉️ Email</button>
        <button class="btn btnGhost btnSm" style="flex:1" onclick="shareViaWhatsApp()">💬 WhatsApp</button>
      </div>
    </div>
    <div class="actionRow" style="margin-top:16px">
      <button class="btn btnGhost btnSm" onclick="closeInvoiceActionModal()" style="width:100%">Close</button>
    </div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  function fmt(n) { return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function fmtPlain(n) { return Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  const ALLOWED_ROLES = ['super_admin','accountant','auditor_team'];
  const EDIT_ROLES = ['super_admin','accountant'];

  let myRole = null;
  let canEdit = false;
  let company = null;
  let lineItems = [];
  let lineItemSeq = 0;
  let allInvoices = [];
  let allProfiles = [];
  let revenueCodeId = null;
  let editingInvoiceId = null;

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fyKeyOf(dateStr) {
    const d = new Date(dateStr); const m = d.getMonth() + 1, y = d.getFullYear();
    return m >= 4 ? y : y - 1;
  }
  // Maps a profile's system role to the party_type vocabulary already used in Ledger Entry / Party Tagging
  function partyTypeForRole(role) {
    if (['investor','director_1','director_2','fico_investor'].includes(role)) return 'investor';
    if (role === 'subscriber') return 'subscriber';
    if (['super_admin','admin','hr_manager','accountant','entry','auditor_team'].includes(role)) return 'employee';
    return 'other';
  }

  window.onVIPLReady = async function() {
    myRole = VIPL.profile.role;
    if (!ALLOWED_ROLES.includes(myRole)) {
      document.getElementById('pageContent').innerHTML = '<div id="noAccess">🔒 No access to this page.</div>';
      return;
    }
    canEdit = EDIT_ROLES.includes(myRole);
    document.getElementById('pageLead').textContent = canEdit
      ? 'Create GST tax invoices for customers and buyers, and keep a record of everything issued.'
      : 'View and export invoices already issued, for audit and tax filing reference.';

    let html = '';

    if (canEdit) {
      html += `
        <div class="card">
          <h2>Your Company Details</h2>
          <div class="cardSub">Shown on every invoice. Set this up once.</div>
          <button class="collapseToggle" id="companyToggle" onclick="toggleCompanyCard()">Show company details ▾</button>
          <div id="companyFields" style="display:none;margin-top:16px"></div>
        </div>

        <div class="card">
          <h2 id="createCardTitle">Create Invoice</h2>
          <div class="cardSub" id="createCardSub">Fill in buyer details and line items. Tax splits automatically based on buyer's state.</div>
          <div class="fieldRow">
            <div><label>Invoice Number</label><input type="text" id="fInvoiceNumber"></div>
            <div><label>Invoice Date</label><input type="date" id="fInvoiceDate"></div>
          </div>

          <div class="fieldRow">
            <div style="grid-column:1/-1">
              <label>Link to an existing user (optional)</label>
              <select id="fBuyerProfile" onchange="onBuyerProfileChange()">
                <option value="">— External buyer, not in the system —</option>
              </select>
            </div>
          </div>

          <div class="fieldRow">
            <div><label>Buyer Name *</label><input type="text" id="fBuyerName" placeholder="Customer or company name"></div>
            <div><label>Buyer GSTIN (optional)</label><input type="text" id="fBuyerGstin" placeholder="e.g. 37ABCDE1234F1Z5"></div>
            <div><label>Buyer State</label><input type="text" id="fBuyerState" placeholder="e.g. Andhra Pradesh" oninput="onBuyerStateChange()"></div>
          </div>
          <div class="fieldRow">
            <div style="grid-column:1/-1"><label>Buyer Address</label><textarea id="fBuyerAddress" rows="2" placeholder="Full billing address"></textarea></div>
          </div>
          <div class="taxModeNote" id="taxModeNote"></div>

          <div class="tableWrap"><table class="lineItemsTable">
            <thead><tr>
              <th style="width:28%">Description</th><th>HSN/SAC</th><th>Qty</th><th>Unit Price</th><th>GST %</th><th>Taxable Value</th><th></th>
            </tr></thead>
            <tbody id="lineItemsBody"></tbody>
          </table></div>
          <button class="btn btnGhost btnSm" onclick="addLineItem()">+ Add Line</button>

          <div class="fieldRow" style="margin-top:20px">
            <div style="grid-column:1/-1"><label>Notes (optional)</label><textarea id="fNotes" rows="2" placeholder="Payment terms, thank-you note, etc."></textarea></div>
          </div>

          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <input type="checkbox" id="fShowBankDetails" checked style="width:auto;accent-color:var(--blue)">
            <label for="fShowBankDetails" style="margin:0;font-size:13px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:normal">Show bank details on this invoice PDF</label>
          </div>

          <div class="totalsBox">
            <div class="totalsInner">
              <div class="totalsRow"><span>Subtotal (Taxable Value)</span><span id="tSubtotal">₹0</span></div>
              <div class="totalsRow" id="tCgstRow"><span>CGST</span><span id="tCgst">₹0</span></div>
              <div class="totalsRow" id="tSgstRow"><span>SGST</span><span id="tSgst">₹0</span></div>
              <div class="totalsRow" id="tIgstRow"><span>IGST</span><span id="tIgst">₹0</span></div>
              <div class="totalsRow grand"><span>Grand Total</span><span id="tGrand">₹0</span></div>
            </div>
          </div>

          <div style="margin-top:22px">
            <label style="font-size:11.5px;font-weight:700;color:var(--g3);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:8px">Payment</label>
            <div class="paymentChoice">
              <label><input type="radio" name="paymentMethod" value="none" checked> 📋 Not received yet — invoice only</label>
              <label><input type="radio" name="paymentMethod" value="cash"> 💵 Received in Cash</label>
              <label><input type="radio" name="paymentMethod" value="bank"> 🏦 Received in Bank</label>
            </div>
            <div style="font-size:12px;color:var(--g3)">Choosing Cash or Bank adds a matching entry to the ledger automatically, linked to this invoice and to the buyer if selected above.</div>
          </div>

          <div class="actionRow">
            <button class="btn btnPrimary" id="saveInvoiceBtn" onclick="saveInvoice()">Save &amp; Generate Invoice</button>
            <button class="btn btnGhost" id="cancelEditBtn" style="display:none" onclick="cancelEditInvoice()">Cancel Edit</button>
          </div>
          <div id="genMsg"></div>
        </div>
      `;
    }

    html += `
      <div class="card">
        <h2>Invoice History</h2>
        <div class="cardSub">All invoices issued to date.</div>
        <div class="tableWrap"><table class="historyTable">
          <thead><tr><th>Invoice #</th><th>Date</th><th>Buyer</th><th>Taxable Value</th><th>Total GST</th><th>Grand Total</th><th>Payment</th><th></th></tr></thead>
          <tbody id="historyBody"><tr><td colspan="8" class="emptyNote">Loading…</td></tr></tbody>
        </table></div>
      </div>
    `;

    document.getElementById('pageContent').innerHTML = html;

    if (canEdit) {
      document.getElementById('fInvoiceDate').value = isoDate(new Date());
      await loadCompanyProfile();
      await loadProfilesForLinking();
      await loadRevenueCodeId();
      await suggestNextInvoiceNumber();
      addLineItem();
    }
    await loadHistory();
  };

  // ── Company profile ──
  let companyEditMode = false;

  async function loadCompanyProfile() {
    const { data } = await VIPL.sb.from('company_profile').select('*').single();
    company = data || {};
    renderCompanySection();
  }

  function companyHasData() {
    return !!(company && (company.gstin || company.bank_account_number || company.address || company.pan));
  }

  function renderCompanySection() {
    if (companyEditMode || !companyHasData()) renderCompanyFields();
    else renderCompanySummary();
  }

  function renderCompanySummary() {
    document.getElementById('companyFields').innerHTML = `
      <div style="font-size:13.5px;line-height:1.9">
        <div style="font-weight:800;font-size:15px;margin-bottom:6px">${escapeHtml(company.company_name||'—')}</div>
        <div><span style="color:var(--g3)">GSTIN:</span> ${escapeHtml(company.gstin||'—')} &nbsp;·&nbsp; <span style="color:var(--g3)">PAN:</span> ${escapeHtml(company.pan||'—')}</div>
        <div><span style="color:var(--g3)">State:</span> ${escapeHtml(company.state||'—')}</div>
        <div>${escapeHtml(company.address||'—')}</div>
        <div style="margin-top:6px"><span style="color:var(--g3)">Bank:</span> ${escapeHtml(company.bank_name||'—')} &nbsp;·&nbsp; <span style="color:var(--g3)">A/C:</span> ${escapeHtml(company.bank_account_number||'—')} &nbsp;·&nbsp; <span style="color:var(--g3)">IFSC:</span> ${escapeHtml(company.bank_ifsc||'—')}</div>
      </div>
      <div class="actionRow" style="margin-top:16px">
        <button class="btn btnGhost btnSm" onclick="enterCompanyEditMode()">Edit company details</button>
      </div>
    `;
  }

  function enterCompanyEditMode() {
    companyEditMode = true;
    renderCompanyFields();
  }

  function renderCompanyFields() {
    document.getElementById('companyFields').innerHTML = `
      <div class="fieldRow">
        <div><label>Company Name</label><input type="text" id="cName" value="${escapeAttr(company.company_name||'')}"></div>
        <div><label>GSTIN</label><input type="text" id="cGstin" value="${escapeAttr(company.gstin||'')}"></div>
        <div><label>PAN</label><input type="text" id="cPan" value="${escapeAttr(company.pan||'')}"></div>
      </div>
      <div class="fieldRow">
        <div><label>State (for CGST/SGST vs IGST)</label><input type="text" id="cState" value="${escapeAttr(company.state||'')}"></div>
        <div><label>Bank Name</label><input type="text" id="cBankName" value="${escapeAttr(company.bank_name||'')}"></div>
        <div><label>Account Number</label><input type="text" id="cBankAcc" value="${escapeAttr(company.bank_account_number||'')}"></div>
        <div><label>IFSC</label><input type="text" id="cBankIfsc" value="${escapeAttr(company.bank_ifsc||'')}"></div>
      </div>
      <div class="fieldRow">
        <div style="grid-column:1/-1"><label>Address</label><textarea id="cAddress" rows="2">${escapeAttr(company.address||'')}</textarea></div>
      </div>
      <div class="actionRow">
        <button class="btn btnPrimary btnSm" onclick="saveCompanyProfile()">Save Company Details</button>
      </div>
      <div id="companyMsg" style="font-size:13px;margin-top:8px;font-weight:600"></div>
    `;
  }

  function toggleCompanyCard() {
    const el = document.getElementById('companyFields');
    const isOpen = el.style.display !== 'none';
    el.style.display = isOpen ? 'none' : 'block';
    document.getElementById('companyToggle').textContent = isOpen ? 'Show company details ▾' : 'Hide company details ▴';
  }

  async function saveCompanyProfile() {
    const payload = {
      company_name: document.getElementById('cName').value.trim(),
      gstin: document.getElementById('cGstin').value.trim() || null,
      pan: document.getElementById('cPan').value.trim() || null,
      state: document.getElementById('cState').value.trim() || null,
      bank_name: document.getElementById('cBankName').value.trim() || null,
      bank_account_number: document.getElementById('cBankAcc').value.trim() || null,
      bank_ifsc: document.getElementById('cBankIfsc').value.trim() || null,
      address: document.getElementById('cAddress').value.trim() || null,
      updated_at: new Date().toISOString()
    };
    const msg = document.getElementById('companyMsg');
    const { error } = await VIPL.sb.from('company_profile').update(payload).eq('id', '00000000-0000-0000-0000-000000000001');
    if (error) { msg.style.color = '#C0392B'; msg.textContent = error.message; return; }
    company = { ...company, ...payload };
    companyEditMode = false;
    renderCompanySummary();
    onBuyerStateChange();
  }

  // ── Linking buyer to an existing profile ──
  async function loadProfilesForLinking() {
    const { data } = await VIPL.sb.from('profiles').select('id, full_name, email, customer_id, role').neq('role','pending').order('full_name');
    allProfiles = data || [];
    const sel = document.getElementById('fBuyerProfile');
    sel.innerHTML = '<option value="">— External buyer, not in the system —</option>' +
      allProfiles.map(p => `<option value="${p.id}">${escapeHtml(p.full_name || p.email)} (${escapeHtml(roleLabel(p.role))}${p.customer_id ? ' · ' + escapeHtml(p.customer_id) : ''})</option>`).join('');
  }

  function roleLabel(role) {
    return ({ investor: 'Investor', director_1: 'Director', director_2: 'Director', fico_investor: 'FICO Investor',
      subscriber: 'Subscriber', accountant: 'Accountant', super_admin: 'Super Admin' })[role] || role;
  }

  function onBuyerProfileChange() {
    const id = document.getElementById('fBuyerProfile').value;
    if (!id) return;
    const p = allProfiles.find(x => x.id === id);
    if (p && !document.getElementById('fBuyerName').value.trim()) {
      document.getElementById('fBuyerName').value = p.full_name || p.email;
    }
  }

  async function loadRevenueCodeId() {
    const { data } = await VIPL.sb.from('common_codes').select('id, label').ilike('label', 'Revenue').limit(1);
    revenueCodeId = data && data[0] ? data[0].id : null;
  }

  // ── Invoice numbering ──
  async function suggestNextInvoiceNumber() {
    const fy = fyKeyOf(new Date().toISOString());
    const fyLabel = `${fy}-${String(fy+1).slice(2)}`;
    const { count } = await VIPL.sb.from('invoices').select('*', { count: 'exact', head: true })
      .gte('invoice_date', isoDate(new Date(fy,3,1))).lte('invoice_date', isoDate(new Date(fy+1,2,31)));
    const next = (count || 0) + 1;
    document.getElementById('fInvoiceNumber').value = `INV/${fyLabel}/${String(next).padStart(4,'0')}`;
  }

  // ── Line items ──
  function addLineItem() {
    lineItemSeq++;
    lineItems.push({ key: lineItemSeq, description: '', hsn: '', qty: 1, price: 0, rate: 18 });
    renderLineItems();
  }
  function removeLineItem(key) {
    lineItems = lineItems.filter(li => li.key !== key);
    if (!lineItems.length) addLineItem();
    else renderLineItems();
  }

  function renderLineItems() {
    document.getElementById('lineItemsBody').innerHTML = lineItems.map(li => `
      <tr>
        <td><input value="${escapeAttr(li.description)}" oninput="updateLineItem(${li.key},'description',this.value)" placeholder="Item or service"></td>
        <td><input class="narrow" value="${escapeAttr(li.hsn)}" oninput="updateLineItem(${li.key},'hsn',this.value)" placeholder="HSN/SAC"></td>
        <td><input class="narrower" type="number" step="1" value="${li.qty}" oninput="updateLineItem(${li.key},'qty',this.value)"></td>
        <td><input class="narrow" type="number" step="0.01" value="${li.price}" oninput="updateLineItem(${li.key},'price',this.value)"></td>
        <td><input class="narrower" type="number" step="0.01" value="${li.rate}" oninput="updateLineItem(${li.key},'rate',this.value)"></td>
        <td class="lineTotal" id="liTotal-${li.key}">${fmt((Number(li.qty)||0) * (Number(li.price)||0))}</td>
        <td><button class="rmBtn" onclick="removeLineItem(${li.key})" title="Remove line">✕</button></td>
      </tr>`).join('');
    updateTotals();
  }

  function updateLineItem(key, field, value) {
    const li = lineItems.find(l => l.key === key);
    if (!li) return;
    li[field] = field === 'description' || field === 'hsn' ? value : parseFloat(value) || 0;
    // Update just this row's computed total in place — never rebuild the input DOM while typing,
    // or every keystroke wipes and recreates the <input>, which drops focus after one character.
    const totalEl = document.getElementById(`liTotal-${key}`);
    if (totalEl) totalEl.textContent = fmt((Number(li.qty)||0) * (Number(li.price)||0));
    updateTotals();
  }

  function isInterState() {
    const buyerState = (document.getElementById('fBuyerState')?.value || '').trim().toLowerCase();
    const companyState = (company?.state || '').trim().toLowerCase();
    if (!buyerState || !companyState) return null; // unknown yet
    return buyerState !== companyState;
  }

  function onBuyerStateChange() {
    const interState = isInterState();
    const note = document.getElementById('taxModeNote');
    if (interState === null) {
      note.innerHTML = `Set your company's state above and the buyer's state to auto-determine <b>CGST+SGST</b> (same state) vs <b>IGST</b> (different state).`;
    } else if (interState) {
      note.innerHTML = `Buyer is in a <b>different state</b> from your company — this invoice will charge <b>IGST</b> only.`;
    } else {
      note.innerHTML = `Buyer is in the <b>same state</b> as your company — this invoice will split tax into <b>CGST + SGST</b>.`;
    }
    updateTotals();
  }

  function updateTotals() {
    const subtotal = lineItems.reduce((s, li) => s + (Number(li.qty)||0) * (Number(li.price)||0), 0);
    const totalTax = lineItems.reduce((s, li) => {
      const taxable = (Number(li.qty)||0) * (Number(li.price)||0);
      return s + taxable * (Number(li.rate)||0) / 100;
    }, 0);
    const interState = isInterState();
    let cgst = 0, sgst = 0, igst = 0;
    if (interState === true) { igst = totalTax; }
    else { cgst = totalTax / 2; sgst = totalTax / 2; } // default to same-state split when unknown, safest common case for a single-state business

    document.getElementById('tSubtotal').textContent = fmt(subtotal);
    document.getElementById('tCgst').textContent = fmt(cgst);
    document.getElementById('tSgst').textContent = fmt(sgst);
    document.getElementById('tIgst').textContent = fmt(igst);
    document.getElementById('tGrand').textContent = fmt(subtotal + cgst + sgst + igst);
    document.getElementById('tCgstRow').style.display = interState === true ? 'none' : 'flex';
    document.getElementById('tSgstRow').style.display = interState === true ? 'none' : 'flex';
    document.getElementById('tIgstRow').style.display = interState === true ? 'flex' : 'none';
  }

  // ── Save invoice (+ optional matching ledger entry) ──
  async function saveInvoice() {
    const msg = document.getElementById('genMsg');
    const buyerName = document.getElementById('fBuyerName').value.trim();
    const invoiceNumber = document.getElementById('fInvoiceNumber').value.trim();
    const invoiceDate = document.getElementById('fInvoiceDate').value;
    if (!buyerName || !invoiceNumber || !invoiceDate) {
      msg.style.color = '#C0392B'; msg.textContent = 'Invoice number, date, and buyer name are required.'; return;
    }
    const validLines = lineItems.filter(li => li.description.trim() && (Number(li.qty)||0) > 0);
    if (!validLines.length) {
      msg.style.color = '#C0392B'; msg.textContent = 'Add at least one line item with a description and quantity.'; return;
    }

    const subtotal = validLines.reduce((s, li) => s + li.qty * li.price, 0);
    const totalTax = validLines.reduce((s, li) => s + (li.qty * li.price) * (li.rate/100), 0);
    const interState = isInterState() === true;
    const cgst = interState ? 0 : totalTax / 2;
    const sgst = interState ? 0 : totalTax / 2;
    const igst = interState ? totalTax : 0;
    const buyerProfileId = document.getElementById('fBuyerProfile').value || null;
    const paymentMethod = document.querySelector('input[name=paymentMethod]:checked').value; // none | cash | bank

    const invoicePayload = {
      invoice_number: invoiceNumber,
      invoice_date: invoiceDate,
      buyer_name: buyerName,
      buyer_gstin: document.getElementById('fBuyerGstin').value.trim() || null,
      buyer_address: document.getElementById('fBuyerAddress').value.trim() || null,
      buyer_state: document.getElementById('fBuyerState').value.trim() || null,
      place_of_supply: document.getElementById('fBuyerState').value.trim() || null,
      buyer_profile_id: buyerProfileId,
      subtotal, cgst_amount: cgst, sgst_amount: sgst, igst_amount: igst,
      total_amount: subtotal + cgst + sgst + igst,
      notes: document.getElementById('fNotes').value.trim() || null,
      show_bank_details: document.getElementById('fShowBankDetails').checked,
      created_by: VIPL.user.id
    };

    msg.style.color = 'var(--g3)'; msg.textContent = editingInvoiceId ? 'Updating…' : 'Saving…';

    let inv;
    if (editingInvoiceId) {
      const { data, error } = await VIPL.sb.from('invoices').update(invoicePayload).eq('id', editingInvoiceId).select().single();
      if (error) { msg.style.color = '#C0392B'; msg.textContent = error.message; return; }
      inv = data;
      // Replace line items wholesale — simplest way to keep them exactly in sync with the edited form
      const { error: delErr } = await VIPL.sb.from('invoice_line_items').delete().eq('invoice_id', inv.id);
      if (delErr) { msg.style.color = '#C0392B'; msg.textContent = 'Invoice updated but old line items failed to clear: ' + delErr.message; return; }
    } else {
      const { data, error } = await VIPL.sb.from('invoices').insert(invoicePayload).select().single();
      if (error) { msg.style.color = '#C0392B'; msg.textContent = error.message; return; }
      inv = data;
    }

    const lineRows = validLines.map((li, i) => ({
      invoice_id: inv.id,
      description: li.description.trim(),
      hsn_sac_code: li.hsn.trim() || null,
      quantity: li.qty,
      unit_price: li.price,
      gst_rate: li.rate,
      line_taxable: li.qty * li.price,
      sort_order: i
    }));
    const { error: lineErr } = await VIPL.sb.from('invoice_line_items').insert(lineRows);
    if (lineErr) { msg.style.color = '#C0392B'; msg.textContent = 'Invoice saved but line items failed: ' + lineErr.message; return; }

    // Editing an existing invoice never touches the ledger here — edit is only allowed while
    // an invoice is still unpaid, and payment is recorded separately via Mark Received.
    if (!editingInvoiceId && paymentMethod !== 'none') {
      const { error: payErr } = await recordPaymentForInvoice(inv, buyerProfileId, paymentMethod, validLines);
      if (payErr) { msg.style.color = '#C0392B'; msg.textContent = 'Invoice saved, but the ledger entry failed: ' + payErr.message; await loadHistory(); return; }
    }

    const wasEditing = !!editingInvoiceId;
    msg.style.color = 'var(--green)'; msg.textContent = wasEditing
      ? '✓ Invoice updated.'
      : (paymentMethod !== 'none'
        ? '✓ Invoice saved and added to the ledger as revenue.'
        : '✓ Invoice saved. Not yet in the ledger — mark it received once payment comes in.');
    await openInvoiceActionPanel(inv, lineRows);
    if (wasEditing) exitEditMode();

    // Reset form for the next invoice
    document.getElementById('fBuyerName').value = '';
    document.getElementById('fBuyerGstin').value = '';
    document.getElementById('fBuyerAddress').value = '';
    document.getElementById('fBuyerState').value = '';
    document.getElementById('fBuyerProfile').value = '';
    document.getElementById('fNotes').value = '';
    document.getElementById('fShowBankDetails').checked = true;
    document.querySelector('input[name=paymentMethod][value=none]').checked = true;
    lineItems = [];
    addLineItem();
    onBuyerStateChange();
    await suggestNextInvoiceNumber();
    await loadHistory();
  }

  // Creates the matching ledger entry for a received payment, links it back to the invoice, and marks the invoice received.
  // Called both at invoice creation time (if payment already received) and later via "Mark as Received."
  async function recordPaymentForInvoice(inv, buyerProfileId, paymentMethod, lines) {
    let partyType = null;
    if (buyerProfileId) {
      const p = allProfiles.find(x => x.id === buyerProfileId) || (await VIPL.sb.from('profiles').select('role').eq('id', buyerProfileId).single()).data;
      if (p) partyType = partyTypeForRole(p.role);
    }
    // A single overall GST rate on the ledger row only makes sense if every line shares one rate.
    const rates = (lines || []).map(l => Number(l.gst_rate ?? l.rate ?? 0));
    const uniformRate = rates.length && rates.every(r => r === rates[0]) ? rates[0] : null;

    const ledgerRow = {
      entry_date: inv.invoice_date,
      particulars: `Invoice ${inv.invoice_number} — ${inv.buyer_name}`,
      description: 'Invoice revenue',
      cash_credit: paymentMethod === 'cash' ? inv.total_amount : 0,
      cash_debit: 0,
      bank_credit: paymentMethod === 'bank' ? inv.total_amount : 0,
      bank_debit: 0,
      party_type: partyType,
      party_profile_id: buyerProfileId,
      common_code_id: revenueCodeId,
      created_by: VIPL.user.id,
      invoice_number: inv.invoice_number,
      gstin: inv.buyer_gstin,
      taxable_value: inv.subtotal,
      gst_rate: uniformRate,
      cgst_amount: inv.cgst_amount,
      sgst_amount: inv.sgst_amount,
      igst_amount: inv.igst_amount
    };
    const { data: entry, error: entryErr } = await VIPL.sb.from('ledger_entries').insert(ledgerRow).select().single();
    if (entryErr) return { error: entryErr };

    const { error: updErr } = await VIPL.sb.from('invoices').update({
      linked_ledger_entry_id: entry.id, payment_status: 'received'
    }).eq('id', inv.id);
    return { error: updErr };
  }

  async function markInvoiceReceived(id) {
    const method = prompt('Received as "cash" or "bank"?', 'bank');
    if (!method || !['cash','bank'].includes(method.trim().toLowerCase())) {
      if (method !== null) alert('Please type exactly "cash" or "bank".');
      return;
    }
    const { data: inv, error } = await VIPL.sb.from('invoices').select('*').eq('id', id).single();
    if (error) { alert(error.message); return; }
    const { data: lines } = await VIPL.sb.from('invoice_line_items').select('*').eq('invoice_id', id);
    if (!revenueCodeId) await loadRevenueCodeId();
    if (!allProfiles.length) await loadProfilesForLinking();
    const { error: payErr } = await recordPaymentForInvoice(inv, inv.buyer_profile_id, method.trim().toLowerCase(), lines || []);
    if (payErr) { alert(payErr.message); return; }
    await loadHistory();
  }

  // Editing is only offered for unpaid, active invoices (see loadHistory) — once a payment/ledger

  // ── PDF generation ──
  function numberToWordsINR(num) {
    const a = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
    const b = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    function inWords(n) {
      if (n < 20) return a[n];
      if (n < 100) return b[Math.floor(n/10)] + (n%10 ? ' ' + a[n%10] : '');
      if (n < 1000) return a[Math.floor(n/100)] + ' hundred' + (n%100 ? ' ' + inWords(n%100) : '');
      if (n < 100000) return inWords(Math.floor(n/1000)) + ' thousand' + (n%1000 ? ' ' + inWords(n%1000) : '');
      if (n < 10000000) return inWords(Math.floor(n/100000)) + ' lakh' + (n%100000 ? ' ' + inWords(n%100000) : '');
      return inWords(Math.floor(n/10000000)) + ' crore' + (n%10000000 ? ' ' + inWords(n%10000000) : '');
    }
    const rupees = Math.floor(num);
    const paise = Math.round((num - rupees) * 100);
    let words = rupees === 0 ? 'zero' : inWords(rupees);
    words = words.charAt(0).toUpperCase() + words.slice(1) + ' rupees';
    if (paise > 0) words += ' and ' + inWords(paise) + ' paise';
    return words + ' only';
  }

  // ── Logo loading (for the PDF header) — falls back to a plain initials icon if unavailable ──
  let logoDataUrlCache = null;
  let logoLoadAttempted = false;
  function loadLogoDataUrl() {
    if (logoLoadAttempted) return Promise.resolve(logoDataUrlCache);
    logoLoadAttempted = true;
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
          logoDataUrlCache = canvas.toDataURL('image/png');
        } catch (e) { logoDataUrlCache = null; }
        resolve(logoDataUrlCache);
      };
      img.onerror = () => { logoDataUrlCache = null; resolve(null); };
      img.src = 'icons/icon-512.png';
    });
  }

  // ── PDF generation — A4, corporate header banner, grouped GST columns. Returns a blob; never auto-downloads. ──
  async function generateInvoicePDF(inv, lines) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageWidth = 210;
    const navy = [11,29,46];
    const tint = [219,234,254];
    const band = [240,247,255];

    // ── Header banner ──
    const bannerH = 36;
    doc.setFillColor(...navy);
    doc.rect(0, 0, pageWidth, bannerH, 'F');

    const logoDataUrl = await loadLogoDataUrl();
    const logoSize = 20;
    // Card is padded larger than the image itself, with gentle rounding — the image's own square
    // corners sit safely inside the card with margin to spare, so they never poke past the rounded
    // edge into the navy banner. Since the image's own background is white and the card is white,
    // there's no visible seam between them — the only edge the eye sees is the card's soft corner.
    const cardPad = 2.5, cardRadius = 4.5;
    const cardX = 14, cardY = 7;
    const cardSize = logoSize + cardPad * 2;
    const logoX = cardX + cardPad, logoY = cardY + cardPad;
    doc.setFillColor(255,255,255);
    doc.roundedRect(cardX, cardY, cardSize, cardSize, cardRadius, cardRadius, 'F');
    if (logoDataUrl) {
      try { doc.addImage(logoDataUrl, 'PNG', logoX, logoY, logoSize, logoSize); } catch (e) { /* card still shows, just empty */ }
    } else {
      const initials = (company?.company_name || 'VI').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
      doc.setTextColor(...navy); doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(initials, cardX + cardSize/2, cardY + cardSize/2 + 3, { align: 'center' });
    }

    const textX = cardX + cardSize + 6;
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(company?.company_name || 'Company Name', textX, 14);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    let hy = 19;
    if (company?.gstin) { doc.text(`GSTIN: ${company.gstin}`, textX, hy); hy += 4; }
    if (company?.address) {
      const addrLines = doc.splitTextToSize(company.address, 90).slice(0, 2);
      doc.text(addrLines, textX, hy);
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('TAX INVOICE', pageWidth - 14, 13, { align: 'right' });
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    doc.text(`Invoice #: ${inv.invoice_number}`, pageWidth - 14, 19, { align: 'right' });
    doc.text(`Date: ${inv.invoice_date}`, pageWidth - 14, 24, { align: 'right' });
    if (inv.place_of_supply) doc.text(`Place of Supply: ${inv.place_of_supply}`, pageWidth - 14, 29, { align: 'right' });

    doc.setTextColor(0,0,0);
    let y = bannerH + 10;

    // ── Bill To box ──
    const billBoxH = 30;
    doc.setFillColor(...band);
    doc.roundedRect(14, y, pageWidth - 28, billBoxH, 2, 2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(100,110,125);
    doc.text('BILL TO', 20, y + 7);
    doc.setTextColor(0,0,0); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
    doc.text(inv.buyer_name, 20, y + 14);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    if (inv.buyer_address) {
      const lines2 = doc.splitTextToSize(inv.buyer_address, pageWidth - 95);
      doc.text(lines2.slice(0,2), 20, y + 19);
    }
    let rightColY = y + 14;
    if (inv.buyer_gstin) { doc.text(`GSTIN: ${inv.buyer_gstin}`, pageWidth - 20, rightColY, { align: 'right' }); rightColY += 5; }
    if (inv.buyer_state) { doc.text(`State: ${inv.buyer_state}`, pageWidth - 20, rightColY, { align: 'right' }); }

    y += billBoxH + 8;

    // ── Line items — grouped GST header so CGST/SGST (or IGST) read as one visual block ──
    const isInterStateInv = Number(inv.igst_amount) > 0;
    const head = isInterStateInv
      ? [
          [
            { content: 'Description', rowSpan: 2, styles: { valign: 'middle' } },
            { content: 'HSN/SAC', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'Qty', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'Unit Price', rowSpan: 2, styles: { valign: 'middle', halign: 'right' } },
            { content: 'Taxable Value', rowSpan: 2, styles: { valign: 'middle', halign: 'right' } },
            { content: 'GST %', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'IGST', colSpan: 1, styles: { halign: 'center', fillColor: tint, textColor: navy } },
            { content: 'Total', rowSpan: 2, styles: { valign: 'middle', halign: 'right' } },
          ],
          [{ content: 'Amount', styles: { halign: 'right', fillColor: tint, textColor: navy } }]
        ]
      : [
          [
            { content: 'Description', rowSpan: 2, styles: { valign: 'middle' } },
            { content: 'HSN/SAC', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'Qty', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'Unit Price', rowSpan: 2, styles: { valign: 'middle', halign: 'right' } },
            { content: 'Taxable Value', rowSpan: 2, styles: { valign: 'middle', halign: 'right' } },
            { content: 'GST %', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'Tax Amount', colSpan: 2, styles: { halign: 'center', fillColor: tint, textColor: navy } },
            { content: 'Total', rowSpan: 2, styles: { valign: 'middle', halign: 'right' } },
          ],
          [
            { content: 'CGST', styles: { halign: 'right', fillColor: tint, textColor: navy } },
            { content: 'SGST', styles: { halign: 'right', fillColor: tint, textColor: navy } }
          ]
        ];

    const body = lines.map(li => {
      const taxable = li.line_taxable;
      const taxAmt = taxable * li.gst_rate / 100;
      const total = taxable + taxAmt;
      return isInterStateInv
        ? [li.description, li.hsn_sac_code||'—', li.quantity, fmtPlain(li.unit_price), fmtPlain(taxable), li.gst_rate + '%', fmtPlain(taxAmt), fmtPlain(total)]
        : [li.description, li.hsn_sac_code||'—', li.quantity, fmtPlain(li.unit_price), fmtPlain(taxable), li.gst_rate + '%', fmtPlain(taxAmt/2), fmtPlain(taxAmt/2), fmtPlain(total)];
    });

    doc.autoTable({
      head, body, startY: y,
      styles: { fontSize: 8, cellPadding: 2.3, lineColor: [225,230,235], lineWidth: 0.1 },
      headStyles: { fillColor: navy, textColor: 255, fontStyle: 'bold', halign: 'center' },
      alternateRowStyles: { fillColor: [250,251,252] },
      columnStyles: { 0: { cellWidth: 44 } }
    });

    let finalY = doc.lastAutoTable.finalY + 8;

    // ── Totals box ──
    // jsPDF's built-in standard fonts (helvetica etc.) don't include the ₹ glyph — it silently
    // renders as a broken "¹" character. Use "Rs." here instead; the on-screen UI still shows ₹ fine.
    const fmtPdf = (n) => 'Rs. ' + Number(n||0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    const totalsBoxW = 84;
    const totalsBoxX = pageWidth - 14 - totalsBoxW;
    const totalsRowsCount = isInterStateInv ? 2 : 3;
    const totalsBoxH = 7 + totalsRowsCount * 6 + 11;
    doc.setFillColor(...band);
    doc.roundedRect(totalsBoxX, finalY, totalsBoxW, totalsBoxH, 2, 2, 'F');
    let ty = finalY + 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(100,110,125); doc.text('Subtotal', totalsBoxX + 6, ty);
    doc.setTextColor(0,0,0); doc.text(fmtPdf(inv.subtotal), pageWidth - 20, ty, { align: 'right' }); ty += 6;
    if (isInterStateInv) {
      doc.setTextColor(100,110,125); doc.text('IGST', totalsBoxX + 6, ty);
      doc.setTextColor(0,0,0); doc.text(fmtPdf(inv.igst_amount), pageWidth - 20, ty, { align: 'right' }); ty += 6;
    } else {
      doc.setTextColor(100,110,125); doc.text('CGST', totalsBoxX + 6, ty);
      doc.setTextColor(0,0,0); doc.text(fmtPdf(inv.cgst_amount), pageWidth - 20, ty, { align: 'right' }); ty += 6;
      doc.setTextColor(100,110,125); doc.text('SGST', totalsBoxX + 6, ty);
      doc.setTextColor(0,0,0); doc.text(fmtPdf(inv.sgst_amount), pageWidth - 20, ty, { align: 'right' }); ty += 6;
    }
    doc.setDrawColor(...navy); doc.line(totalsBoxX + 6, ty, pageWidth - 20, ty); ty += 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...navy);
    doc.text('Grand Total', totalsBoxX + 6, ty);
    doc.text(fmtPdf(inv.total_amount), pageWidth - 20, ty, { align: 'right' });

    finalY += totalsBoxH + 8;
    doc.setTextColor(0,0,0);

    doc.setFont('helvetica','italic'); doc.setFontSize(8.5);
    const words = doc.splitTextToSize(`Amount in words: ${numberToWordsINR(Number(inv.total_amount))}`, pageWidth - 28);
    doc.text(words, 14, finalY); finalY += words.length * 4.5 + 6;
    doc.setFont('helvetica','normal');

    const showBank = inv.show_bank_details !== false;
    if (showBank && (company?.bank_name || company?.bank_account_number)) {
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...navy);
      doc.text('Bank Details', 14, finalY); finalY += 5;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
      if (company.bank_name) { doc.text(`Bank: ${company.bank_name}`, 14, finalY); finalY += 4.5; }
      if (company.bank_account_number) { doc.text(`Account No: ${company.bank_account_number}`, 14, finalY); finalY += 4.5; }
      if (company.bank_ifsc) { doc.text(`IFSC: ${company.bank_ifsc}`, 14, finalY); finalY += 4.5; }
      finalY += 4;
    }

    if (inv.notes) {
      doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(90,100,115);
      const noteLines = doc.splitTextToSize(inv.notes, pageWidth - 28);
      doc.text(noteLines, 14, finalY); finalY += noteLines.length * 4.5 + 4;
    }

    doc.setDrawColor(225,230,235); doc.line(14, 280, pageWidth - 14, 280);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,150,160);
    doc.text('This is a computer-generated invoice.', 14, 285);

    const filename = `${inv.invoice_number.replace(/\//g,'-')}.pdf`;
    const blob = doc.output('blob');
    return { blob, filename };
  }

  // ── View / Download / Share panel — replaces the old auto-download behavior ──
  let currentGenerated = null; // { inv, blob, url, filename }

  async function openInvoiceActionPanel(inv, lines) {
    const { blob, filename } = await generateInvoicePDF(inv, lines);
    const url = URL.createObjectURL(blob);
    currentGenerated = { inv, blob, url, filename };
    document.getElementById('iaTitle').textContent = `Invoice ${inv.invoice_number}`;
    document.getElementById('iaSub').textContent = `${inv.buyer_name} · ${fmt(inv.total_amount)}`;
    document.getElementById('iaFallbackShare').style.display = 'none';
    document.getElementById('invoiceActionModal').classList.add('open');
  }

  function closeInvoiceActionModal() {
    document.getElementById('invoiceActionModal').classList.remove('open');
    if (currentGenerated?.url) URL.revokeObjectURL(currentGenerated.url);
    currentGenerated = null;
  }

  function viewGeneratedPDF() {
    if (!currentGenerated) return;
    window.open(currentGenerated.url, '_blank');
  }

  function downloadGeneratedPDF() {
    if (!currentGenerated) return;
    const a = document.createElement('a');
    a.href = currentGenerated.url; a.download = currentGenerated.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  async function shareGeneratedPDF() {
    if (!currentGenerated) return;
    const { inv, blob, filename } = currentGenerated;
    const file = new File([blob], filename, { type: 'application/pdf' });
    const text = `Invoice ${inv.invoice_number} — ${inv.buyer_name}, Total ${fmt(inv.total_amount)}`;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: `Invoice ${inv.invoice_number}`, text }); return; } catch (e) { return; }
    }
    // Desktop browsers generally can't attach a file to Email/WhatsApp from a web page —
    // download it and open the app with a prefilled message so the user just attaches it.
    document.getElementById('iaFallbackShare').style.display = 'flex';
    downloadGeneratedPDF();
  }

  function shareViaEmail() {
    if (!currentGenerated) return;
    const { inv } = currentGenerated;
    const subject = encodeURIComponent(`Invoice ${inv.invoice_number}`);
    const body = encodeURIComponent(`Hi ${inv.buyer_name},\n\nPlease find attached Invoice ${inv.invoice_number} dated ${inv.invoice_date} for ${fmt(inv.total_amount)}.\n\n(Attach the PDF that just downloaded — this window can't attach it automatically.)\n\nThank you.`);
    window.open(`mailto:?subject=${subject}&body=${body}`);
  }

  function shareViaWhatsApp() {
    if (!currentGenerated) return;
    const { inv } = currentGenerated;
    const text = encodeURIComponent(`Invoice ${inv.invoice_number} dated ${inv.invoice_date} for ${fmt(inv.total_amount)} — attaching the PDF now.`);
    window.open(`https://wa.me/?text=${text}`, '_blank');
  }

  async function reprintInvoice(id) {
    const { data: inv, error } = await VIPL.sb.from('invoices').select('*').eq('id', id).single();
    if (error) { alert(error.message); return; }
    const { data: lines } = await VIPL.sb.from('invoice_line_items').select('*').eq('invoice_id', id).order('sort_order');
    if (!company) await loadCompanyProfile();
    await openInvoiceActionPanel(inv, lines || []);
  }

  // Cancel: the correct path for a mistaken or void invoice. Keeps the row and invoice_number
  // (never deleted) so the sequential numbering stays intact for GST audit purposes.
  async function cancelInvoice(id, invoiceNumber, hasLinkedLedgerEntry, linkedAmount) {
    const reason = prompt(`Cancel invoice ${invoiceNumber}? Enter a reason (optional):`);
    if (reason === null) return; // user hit Cancel on the prompt itself
    const { error } = await VIPL.sb.from('invoices').update({
      status: 'cancelled', cancelled_at: new Date().toISOString(), cancelled_reason: reason || null
    }).eq('id', id);
    if (error) { alert(error.message); return; }
    if (hasLinkedLedgerEntry) {
      alert(`Invoice ${invoiceNumber} is cancelled. It had a linked ledger entry for ${fmt(linkedAmount)} — go to Ledger Entry and reverse or delete that transaction manually if the money needs to come back out. It was left untouched on purpose.`);
    }
    await loadHistory();
  }

  // Hard delete: only for a genuine duplicate/accidental row with zero real-world consequence
  // (no one has seen the PDF, no linked ledger entry). Breaks sequential numbering — use Cancel instead
  // for anything that was actually issued. Restricted to Super Admin.
  async function deleteInvoice(id, invoiceNumber) {
    if (!confirm(`Permanently delete invoice ${invoiceNumber}? This breaks sequential invoice numbering and cannot be undone. Only do this for an accidental duplicate that was never actually issued — use Cancel instead for anything real.`)) return;
    const { error } = await VIPL.sb.from('invoices').delete().eq('id', id);
    if (error) { alert(error.message); return; }
    await loadHistory();
  }

  async function loadHistory() {
    const tbody = document.getElementById('historyBody');
    const { data, error } = await VIPL.sb.from('invoices').select('*').order('invoice_date', { ascending: false }).order('created_at', { ascending: false });
    if (error) { tbody.innerHTML = `<tr><td colspan="8" style="color:#C0392B">${error.message}</td></tr>`; return; }
    allInvoices = data || [];
    if (!allInvoices.length) { tbody.innerHTML = `<tr><td colspan="8" class="emptyNote">No invoices issued yet.</td></tr>`; return; }
    tbody.innerHTML = allInvoices.map(inv => {
      const totalGst = Number(inv.cgst_amount||0) + Number(inv.sgst_amount||0) + Number(inv.igst_amount||0);
      const received = inv.payment_status === 'received';
      const isCancelled = inv.status === 'cancelled';
      const rowStyle = isCancelled ? ' style="opacity:.55;text-decoration:line-through"' : '';

      let paymentCell;
      if (isCancelled) {
        paymentCell = `<span class="pill" style="background:#FEE2E2;color:#C0392B">Cancelled</span>`;
      } else if (received) {
        paymentCell = '<span class="pill received">✓ In Ledger</span>';
      } else if (canEdit) {
        paymentCell = `<span class="pill unpaid">Unpaid</span> <button class="btn btnAmber btnSm" style="margin-top:4px" onclick="markInvoiceReceived('${inv.id}')">Mark Received</button>`;
      } else {
        paymentCell = '<span class="pill unpaid">Unpaid</span>';
      }

      let actionsCell = `<button class="btn btnGhost btnSm" onclick="reprintInvoice('${inv.id}')">View / Share</button>`;
      if (canEdit && !isCancelled && !received) {
        actionsCell += ` <button class="btn btnGhost btnSm" onclick="editInvoiceRow('${inv.id}')">Edit</button>`;
      }
      if (canEdit && !isCancelled) {
        actionsCell += ` <button class="btn btnDanger btnSm" onclick="cancelInvoice('${inv.id}','${escapeAttr(inv.invoice_number)}',${received},${inv.total_amount})">Cancel</button>`;
      }
      if (myRole === 'super_admin' && !received) {
        actionsCell += ` <button class="btn btnGhost btnSm" style="color:#C0392B" onclick="deleteInvoice('${inv.id}','${escapeAttr(inv.invoice_number)}')">Delete</button>`;
      }

      return `
        <tr${rowStyle}>
          <td><strong>${escapeHtml(inv.invoice_number)}</strong></td>
          <td>${inv.invoice_date}</td>
          <td>${escapeHtml(inv.buyer_name)}</td>
          <td>${fmt(inv.subtotal)}</td>
          <td>${fmt(totalGst)}</td>
          <td><strong>${fmt(inv.total_amount)}</strong></td>
          <td>${paymentCell}</td>
          <td><div class="actionRow" style="margin:0">${actionsCell}</div></td>
        </tr>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }
</script>
