<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Party Tagging — VIPL Internal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="../logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  #mainArea .lead { font-size: 14px; color: var(--g3); margin-bottom: 24px; margin-top: -12px; }
  #noAccess { text-align: center; padding: 60px 20px; color: var(--g3); }

  .statBar { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .statChip { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; }
  .statChip .val { font-family:'Plus Jakarta Sans',sans-serif; font-size: 20px; font-weight: 800; }
  .statChip .lbl { font-size: 11.5px; color: var(--g3); margin-top: 2px; }

  .groupCard { background: #fff; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .groupHead {
    display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
    background: #FAFBFC; cursor: pointer; user-select: none; gap: 14px; flex-wrap: wrap;
  }
  .groupHead:hover { background: #F2F4F7; }
  .groupTitle { display: flex; align-items: center; gap: 12px; }
  .groupAvatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff;
    font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .groupName { font-weight: 800; font-size: 15px; }
  .groupCount { font-size: 12px; color: var(--g3); }
  .groupActions { display: flex; align-items: center; gap: 10px; }
  .partyTypeSelect { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 12.5px; font-family: inherit; }
  .chevron { font-size: 11px; color: var(--g3); transition: transform .15s; }
  .chevron.open { transform: rotate(90deg); }

  .groupBody { display: none; border-top: 1px solid var(--border); }
  .groupBody.open { display: block; }
  .entryRow { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid #F0F2F5; font-size: 13px; }
  .entryRow:first-child { border-top: none; }
  .entryRow:hover { background: #FAFBFD; }
  .entryRow input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--blue); flex-shrink: 0; }
  .entryDate { width: 90px; color: var(--g3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .entryText { flex: 1; min-width: 0; }
  .entryParticulars { font-weight: 600; }
  .entryDesc { font-size: 12px; color: var(--g3); }
  .entryAmount { font-variant-numeric: tabular-nums; font-weight: 700; flex-shrink: 0; width: 100px; text-align: right; }

  .groupFoot { padding: 14px 20px; background: #FAFBFC; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .btn { padding: 9px 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; transition: opacity .15s; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btnPrimary { background: var(--blue); color: #fff; }
  .btnGhost { background: #fff; border: 1px solid var(--border); color: var(--ink); }
  .selectAllLink { font-size: 12.5px; color: var(--blue); font-weight: 700; cursor: pointer; background: none; border: none; }

  .unmatchedCard { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .unmatchedRow {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap;
  }
  .unmatchedRow:first-child { border-top: none; }
  .unmatchedRow:hover { background: #FAFBFD; }
  .unmatchedRow select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 12.5px; font-family: inherit; }
  .btnAmber { background: #FBF1DE; color: #B7791F; }

  .sectionTitle { font-family:'Plus Jakarta Sans',sans-serif; font-size: 15px; font-weight: 800; margin: 30px 0 12px; display: flex; align-items: center; gap: 8px; }
  .sectionSub { font-size: 12.5px; color: var(--g3); margin-bottom: 14px; margin-top: -8px; }
  .doneNote { font-size: 13px; color: var(--g3); padding: 30px; text-align: center; }
  .successMsg { font-size: 12.5px; color: var(--green); font-weight: 700; margin-left: 10px; }
</style>
</head>
<body>

<div id="authBox"></div>

<div id="appShell">
  <div id="sidebar"></div>
  <div id="mainArea">
    <h1 class="pageTitle">Party Tagging</h1>
    <div class="lead">Suggested matches for untagged ledger entries, grouped by person. Nothing is saved until you confirm a group.</div>
    <div id="pageContent"></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  const ALLOWED_ROLES = ['super_admin','accountant'];
  const PARTY_TYPE_OPTIONS = [
    { value: 'investor', label: 'Investor' }, { value: 'employee', label: 'Employee' },
    { value: 'lender', label: 'Lender' }, { value: 'subscriber', label: 'Subscriber' },
    { value: 'vendor', label: 'Vendor' }, { value: 'other', label: 'Other' }
  ];
  function fmt(n) { return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function initials(s) { return (s||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function guessPartyType(role) {
    if (['investor','director_1','director_2'].includes(role)) return 'investor';
    if (role) return 'employee';
    return 'other';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let allProfiles = [];
  let commonCodes = [];
  let untaggedEntries = [];
  let groups = []; // { profileId, profileName, partyType, entries: [...] }
  let codeGroups = []; // { code, label, codeId, entries: [...] }
  let unmatched = [];

  window.onVIPLReady = async function() {
    if (!ALLOWED_ROLES.includes(VIPL.profile.role)) {
      document.getElementById('pageContent').innerHTML = '<div id="noAccess">🔒 No access to this page. Party tagging is limited to Super Admin and Accountant accounts.</div>';
      return;
    }
    document.getElementById('pageContent').innerHTML = `<div style="text-align:center;color:var(--g3);padding:40px">Scanning entries for name matches…</div>`;
    await loadAndMatch();
  };

  function suggestCommonCode(text) {
    const t = (text || '').toLowerCase();
    if (/electric|power|gp electricity/.test(t)) return 'UTILITIES';
    if (/airtel|vi post|vi\s|mobile|internet|net bill/.test(t)) return 'UTILITIES';
    if (/petrol|fuel/.test(t)) return 'FUEL';
    if (/salary|allowance/.test(t)) return 'SALARY_UNLINKED';
    if (/\brent\b/.test(t)) return 'RENT';
    if (/food|restaurent|restaurant/.test(t)) return 'FOOD';
    if (/travel|\bbus\b|flight|hotel/.test(t)) return 'TRAVEL';
    if (/bank charg/.test(t)) return 'BANK_CHARGES';
    if (/office|printing|stationary|maintenance/.test(t)) return 'OFFICE';
    return 'MISC';
  }

  async function loadAndMatch() {
    const [{ data: profiles }, { data: entries }, { data: codes }] = await Promise.all([
      VIPL.sb.from('profiles').select('id, full_name, customer_id, role').neq('role', 'pending'),
      VIPL.sb.from('ledger_entries').select('id, entry_date, particulars, description, cash_credit, cash_debit, bank_credit, bank_debit')
        .is('party_profile_id', null).is('common_code_id', null).order('entry_date', { ascending: false }),
      VIPL.sb.from('common_codes').select('*').order('sort_order')
    ]);
    allProfiles = profiles || [];
    commonCodes = codes || [];
    untaggedEntries = entries || [];

    // Build a word list per profile (words of 4+ letters, to avoid trivial matches like "N" or "Raj")
    const profileWordSets = allProfiles.map(p => ({
      profile: p,
      words: (p.full_name || '').toLowerCase().split(/\s+/).filter(w => w.length >= 4)
    })).filter(pw => pw.words.length);

    const groupMap = new Map(); // profileId -> entries[]
    unmatched = [];

    untaggedEntries.forEach(e => {
      const haystack = `${e.particulars || ''} ${e.description || ''}`.toLowerCase();
      let best = null, bestScore = 0;
      profileWordSets.forEach(pw => {
        const score = pw.words.filter(w => haystack.includes(w)).length;
        if (score > bestScore) { bestScore = score; best = pw.profile; }
      });
      if (best) {
        if (!groupMap.has(best.id)) groupMap.set(best.id, { profile: best, entries: [] });
        groupMap.get(best.id).entries.push(e);
      } else {
        unmatched.push(e);
      }
    });

    groups = Array.from(groupMap.values())
      .map(g => ({ profileId: g.profile.id, profileName: g.profile.full_name, customerId: g.profile.customer_id, role: g.profile.role, entries: g.entries }))
      .sort((a,b) => b.entries.length - a.entries.length);

    const codeById = Object.fromEntries(commonCodes.map(c => [c.code, c]));
    const codeGroupMap = new Map();
    unmatched.forEach(e => {
      const text = `${e.particulars || ''} ${e.description || ''}`;
      const code = suggestCommonCode(text);
      if (!codeGroupMap.has(code)) codeGroupMap.set(code, []);
      codeGroupMap.get(code).push(e);
    });
    codeGroups = Array.from(codeGroupMap.entries())
      .map(([code, entries]) => ({ code, label: codeById[code]?.label || code, codeId: codeById[code]?.id, entries }))
      .sort((a,b) => b.entries.length - a.entries.length);

    render();
  }

  function render() {
    if (!untaggedEntries.length) {
      document.getElementById('pageContent').innerHTML = `<div class="doneNote">✅ All ledger entries are tagged. Nothing left to review here.</div>`;
      return;
    }

    let html = `
      <div class="statBar">
        <div class="statChip"><div class="val">${untaggedEntries.length}</div><div class="lbl">Untagged entries</div></div>
        <div class="statChip"><div class="val">${groups.length}</div><div class="lbl">Suggested people</div></div>
        <div class="statChip"><div class="val">${codeGroups.length}</div><div class="lbl">Common-code groups</div></div>
      </div>
      <div class="sectionTitle">Suggested Matches — People</div>
      <div class="sectionSub">Grouped by likely person, based on their name appearing in the entry's particulars or description. Review each group, uncheck anything that doesn't belong, then confirm.</div>
      <div id="groupsWrap"></div>
    `;
    if (codeGroups.length) {
      html += `
        <div class="sectionTitle">Suggested Common Codes <span style="font-weight:600;color:var(--g3);font-size:12.5px">(${unmatched.length} entries not tied to a specific person)</span></div>
        <div class="sectionSub">Grouped by likely category — utility bills, fuel, unlinked staff salaries, etc. Review, then confirm each group. Each row also has a quick "Or person" override if one of these actually belongs to someone specific.</div>
        <div id="codeGroupsWrap"></div>
      `;
    }
    document.getElementById('pageContent').innerHTML = html;

    document.getElementById('groupsWrap').innerHTML = groups.map((g, gi) => `
      <div class="groupCard">
        <div class="groupHead" onclick="toggleGroup(${gi})">
          <div class="groupTitle">
            <span class="chevron" id="chev-${gi}">▶</span>
            <div class="groupAvatar">${initials(g.profileName)}</div>
            <div><div class="groupName">${escapeHtml(g.profileName)} <span style="font-weight:600;color:var(--g3);font-size:12px">${g.customerId ? '· ' + escapeHtml(g.customerId) : ''}</span></div><div class="groupCount">${g.entries.length} matched entries</div></div>
          </div>
          <div class="groupActions" onclick="event.stopPropagation()">
            <select class="partyTypeSelect" id="ptype-${gi}">
              ${PARTY_TYPE_OPTIONS.map(o => `<option value="${o.value}"${o.value === guessPartyType(g.role) ? ' selected' : ''}>${o.label}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="groupBody" id="gbody-${gi}">
          <div style="padding:10px 20px;border-top:1px solid var(--border)">
            <button class="selectAllLink" onclick="toggleAllInGroup(${gi}, true)">Select all</button> ·
            <button class="selectAllLink" onclick="toggleAllInGroup(${gi}, false)">Select none</button>
          </div>
          ${g.entries.map((e, ei) => `
            <div class="entryRow">
              <input type="checkbox" checked id="chk-${gi}-${ei}">
              <div class="entryDate">${e.entry_date}</div>
              <div class="entryText"><div class="entryParticulars">${escapeHtml(e.particulars || '')}</div><div class="entryDesc">${escapeHtml(e.description || '—')}</div></div>
              <div class="entryAmount">${fmt((e.cash_credit||0)+(e.bank_credit||0)-(e.cash_debit||0)-(e.bank_debit||0))}</div>
            </div>
          `).join('')}
        </div>
        <div class="groupFoot">
          <span style="font-size:12.5px;color:var(--g3)">Confirming will link the checked entries to <strong>${escapeHtml(g.profileName)}</strong>.</span>
          <span>
            <button class="btn btnPrimary" id="confirmBtn-${gi}" onclick="confirmGroup(${gi})">Tag Selected Entries</button>
            <span class="successMsg" id="successMsg-${gi}" style="display:none"></span>
          </span>
        </div>
      </div>
    `).join('');

    if (codeGroups.length) {
      document.getElementById('codeGroupsWrap').innerHTML = codeGroups.map((cg, ci) => `
        <div class="groupCard">
          <div class="groupHead" onclick="toggleCodeGroup(${ci})">
            <div class="groupTitle">
              <span class="chevron" id="cchev-${ci}">▶</span>
              <div class="groupAvatar" style="background:#B7791F">🏷️</div>
              <div><div class="groupName">${escapeHtml(cg.label)}</div><div class="groupCount">${cg.entries.length} entries</div></div>
            </div>
          </div>
          <div class="groupBody" id="cgbody-${ci}">
            <div style="padding:10px 20px;border-top:1px solid var(--border)">
              <button class="selectAllLink" onclick="toggleAllInCodeGroup(${ci}, true)">Select all</button> ·
              <button class="selectAllLink" onclick="toggleAllInCodeGroup(${ci}, false)">Select none</button>
            </div>
            ${cg.entries.map(e => `
              <div class="entryRow">
                <input type="checkbox" checked id="cchk-${ci}-${e.id}">
                <div class="entryDate">${e.entry_date}</div>
                <div class="entryText"><div class="entryParticulars">${escapeHtml(e.particulars || '')}</div><div class="entryDesc">${escapeHtml(e.description || '—')}</div></div>
                <div class="entryAmount">${fmt((e.cash_credit||0)+(e.bank_credit||0)-(e.cash_debit||0)-(e.bank_debit||0))}</div>
                <select id="mp-${e.id}" style="max-width:170px"><option value="">Or person…</option>${allProfiles.map(p=>`<option value="${p.id}">${escapeHtml(p.full_name)}${p.customer_id ? ' · ' + escapeHtml(p.customer_id) : ''}</option>`).join('')}</select>
                <button class="btn btnGhost" style="padding:5px 10px;font-size:11px" onclick="tagSingle('${e.id}')">Tag</button>
              </div>
            `).join('')}
          </div>
          <div class="groupFoot">
            <span style="font-size:12.5px;color:var(--g3)">Confirming will tag the checked entries as <strong>${escapeHtml(cg.label)}</strong>.</span>
            <span><button class="btn btnAmber" id="codeConfirmBtn-${ci}" onclick="confirmCodeGroup(${ci})">Tag Selected Entries</button></span>
          </div>
        </div>
      `).join('');
    }
  }

  function toggleGroup(gi) {
    document.getElementById(`gbody-${gi}`).classList.toggle('open');
    document.getElementById(`chev-${gi}`).classList.toggle('open');
  }

  function toggleAllInGroup(gi, checked) {
    const g = groups[gi];
    g.entries.forEach((e, ei) => { document.getElementById(`chk-${gi}-${ei}`).checked = checked; });
  }

  async function confirmGroup(gi) {
    const g = groups[gi];
    const partyType = document.getElementById(`ptype-${gi}`).value;
    const idsToTag = g.entries.filter((e, ei) => document.getElementById(`chk-${gi}-${ei}`).checked).map(e => e.id);
    if (!idsToTag.length) return;

    const btn = document.getElementById(`confirmBtn-${gi}`);
    btn.disabled = true; btn.textContent = 'Tagging…';

    const { error } = await VIPL.sb.from('ledger_entries')
      .update({ party_type: partyType, party_profile_id: g.profileId })
      .in('id', idsToTag);

    if (error) {
      btn.disabled = false; btn.textContent = 'Tag Selected Entries';
      alert(error.message);
      return;
    }

    const taggedSet = new Set(idsToTag);
    untaggedEntries = untaggedEntries.filter(e => !taggedSet.has(e.id));
    g.entries = g.entries.filter(e => !taggedSet.has(e.id));
    if (!g.entries.length) groups.splice(gi, 1);
    render();
  }

  function toggleCodeGroup(ci) {
    document.getElementById(`cgbody-${ci}`).classList.toggle('open');
    document.getElementById(`cchev-${ci}`).classList.toggle('open');
  }

  function toggleAllInCodeGroup(ci, checked) {
    codeGroups[ci].entries.forEach(e => { document.getElementById(`cchk-${ci}-${e.id}`).checked = checked; });
  }

  async function confirmCodeGroup(ci) {
    const cg = codeGroups[ci];
    const idsToTag = cg.entries.filter(e => document.getElementById(`cchk-${ci}-${e.id}`).checked).map(e => e.id);
    if (!idsToTag.length) return;

    const btn = document.getElementById(`codeConfirmBtn-${ci}`);
    btn.disabled = true; btn.textContent = 'Tagging…';

    const { error } = await VIPL.sb.from('ledger_entries')
      .update({ common_code_id: cg.codeId, party_type: 'other' })
      .in('id', idsToTag);

    if (error) {
      btn.disabled = false; btn.textContent = 'Tag Selected Entries';
      alert(error.message);
      return;
    }

    const taggedSet = new Set(idsToTag);
    untaggedEntries = untaggedEntries.filter(e => !taggedSet.has(e.id));
    unmatched = unmatched.filter(e => !taggedSet.has(e.id));
    cg.entries = cg.entries.filter(e => !taggedSet.has(e.id));
    if (!cg.entries.length) codeGroups.splice(ci, 1);
    render();
  }

  async function tagSingle(entryId) {
    const e = unmatched.find(x => x.id === entryId);
    if (!e) return;
    const personId = document.getElementById(`mp-${entryId}`).value;
    if (!personId) { alert('Choose a person first.'); return; }
    const profile = allProfiles.find(p => p.id === personId);
    const partyType = guessPartyType(profile ? profile.role : null);

    const { error } = await VIPL.sb.from('ledger_entries')
      .update({ party_type: partyType, party_profile_id: personId })
      .eq('id', e.id);
    if (error) { alert(error.message); return; }

    untaggedEntries = untaggedEntries.filter(x => x.id !== e.id);
    unmatched = unmatched.filter(x => x.id !== e.id);
    codeGroups.forEach(cg => { cg.entries = cg.entries.filter(x => x.id !== e.id); });
    codeGroups = codeGroups.filter(cg => cg.entries.length);
    render();
  }
</script>
</body>
</html>
